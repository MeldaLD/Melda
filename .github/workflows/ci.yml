name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Typen, Lint, Format, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatierung
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Platzhalter: Der Build darf keine echten Zugangsdaten brauchen.
          # Datenbankzugriffe passieren erst zur Laufzeit.
          NEXT_PUBLIC_SUPABASE_URL: https://platzhalter.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: platzhalter
          NEXT_PUBLIC_BASIS_URL: http://localhost:3000
          ADMIN_PASSWORT: platzhalter
          ADMIN_SESSION_SECRET: platzhalter-nur-fuer-den-build
