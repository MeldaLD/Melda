<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" />
    <title>resident-dj · Buehne</title>
    <link rel="stylesheet" href="/buehne/buehne.css" />
  </head>
  <body>
    <!-- Die Visualisierung liegt hinter allem und fuellt das ganze Bild. Auf
         einem Monitor im Raum ist sie die Hauptsache; die Schrift darueber ist
         fuer den, der davorsteht. Deshalb bleibt die Mitte frei. -->
    <canvas id="visual" aria-hidden="true"></canvas>

    <!-- Browser lassen Ton erst nach einem Klick zu. Der Startschirm ist also
         keine Deko, sondern Pflicht - und gleich der richtige Ort, um zu
         erklaeren, was gleich passiert. -->
    <div class="start" id="startschirm">
      <div class="start-inhalt">
        <h1>resident&#8209;dj</h1>
        <p class="unterzeile">
          Zwei Decks, phrasengenaue Uebergaenge, Bass&#8209;Tausch. Der Abend laeuft von allein.
        </p>

        <div class="start-wahl">
          <button class="gross" id="startDemo">
            <strong><span class="play">▶</span> Pruefstand starten</strong>
            <span
              >Acht erzeugte Tracks von chillig bis hart. Sofort hoerbar, ohne eigene
              Musik.</span
            >
          </button>
          <button class="gross" id="startEcht">
            <strong><span class="play">▶</span> Eigene Bibliothek</strong>
            <span id="echtHinweis">Prüfe …</span>
          </button>
        </div>

        <p class="fussnote" id="startFehler" hidden></p>
      </div>
    </div>

    <!--
      iOS haelt den Ton an, sobald man die App wechselt oder das Display
      sperrt - und laesst ihn nur nach einer Beruehrung wieder laufen. Ohne
      diesen Schirm steht die Buehne dann stumm da und sieht kaputt aus.
    -->
    <button class="weiter" id="weiter" hidden>
      <span class="play gross-play">▶</span>
      <span>Ton weiterlaufen lassen</span>
    </button>

    <main id="konsole" hidden>
      <header>
        <div class="kopf-links">
          <span class="marke" id="anlass">resident-dj</span>
          <span class="pruefstand" id="pruefstandMarke" hidden>Prüfstand</span>
        </div>
        <div class="kopf-rechts">
          <span id="uhr"></span>
          <span class="pegel"><i id="pegelBalken"></i></span>
        </div>
      </header>

      <!-- Die Mitte bleibt leer. Da laeuft das Bild. -->

      <footer class="fuss">
        <div class="jetzt" id="deckA">
          <span class="etikett">Läuft</span>
          <h2 class="deck-titel">–</h2>
          <p class="zeile">
            <span class="deck-interpret"></span>
            <span class="deck-bpm"></span>
          </p>
          <div class="fortschritt"><i></i><u></u></div>
          <div class="regler">
            <span class="reglerbalken"><i data-regler="blende"></i></span>
            <span class="reglerbalken bass"><i data-regler="tief"></i></span>
          </div>
        </div>

        <div class="mitte">
          <div class="uebergang" id="uebergang" hidden>
            <span class="uebergang-name" id="uebergangName"></span>
            <div class="uebergang-balken"><i id="uebergangFortschritt"></i></div>
            <span class="uebergang-grund" id="uebergangGrund"></span>
          </div>
          <div class="wartend" id="wartend"></div>
        </div>

        <div class="jetzt rechts" id="deckB">
          <span class="etikett">Als nächstes</span>
          <h2 class="deck-titel">–</h2>
          <p class="zeile">
            <span class="deck-interpret"></span>
            <span class="deck-bpm"></span>
          </p>
          <div class="fortschritt"><i></i><u></u></div>
          <div class="regler">
            <span class="reglerbalken"><i data-regler="blende"></i></span>
            <span class="reglerbalken bass"><i data-regler="tief"></i></span>
          </div>
        </div>
      </footer>

      <!--
        Die Steuerung blendet sich nach ein paar Sekunden ohne Mausbewegung
        aus. Am Partyabend fasst sie niemand an und soll das Bild nicht
        zerschneiden; beim Entwickeln ist sie mit einer Handbewegung wieder da.
      -->
      <div class="steuerung" id="steuerung">
        <span class="naechster-grund" id="naechsterGrund"></span>
        <span class="naechster" id="naechster" hidden></span>
        <button id="wiedergabe" title="Anhalten und weiterlaufen lassen">▶</button>
        <button id="jetztUeberblenden">Jetzt überblenden</button>
        <select id="artWahl" title="Übergangsart erzwingen">
          <option value="">automatisch</option>
          <option value="blende">Lange Blende</option>
          <option value="aufzug">Filteraufzug</option>
          <option value="echo">Echo-Schnitt</option>
          <option value="schnitt">Harter Schnitt</option>
        </select>
        <label class="schieber">
          <span id="energieWert">50 %</span>
          <input type="range" id="energieRegler" min="0" max="100" value="50" />
        </label>
        <span class="stil" id="stil" title="Wie der DJ gerade spielt – haengt an der Zielenergie">–</span>
        <label class="schalter">
          <input type="checkbox" id="remixAn" checked />
          Remix
        </label>
        <span class="fussnote" id="energieQuelle"></span>
        <label class="schalter">
          <input type="checkbox" id="angleichAn" checked />
          Angleich
        </label>
        <ol class="verlauf" id="verlauf"></ol>
      </div>
    </main>

    <script type="module" src="/buehne/buehne.js"></script>
  </body>
</html>
