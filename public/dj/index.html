  mandelSchnappschussNehmen = true;
  // An der neuen Stelle gilt der alte Wertebereich nicht mehr. Nachgefuehrt
  // wuerde er sich zwar einpendeln, aber die ersten Bilder waeren daneben -
  // und die stehen direkt hinter dem Blitz, wo man wieder hinsieht.
  mandelMuTief = 0;
  mandelMuSpanne = 60;
  mandelInnenTief = 0;
  mandelInnenSpanne = 0.5;
  // Der Wertespeicher zeigt jetzt auf die falsche Stelle im Bild.
  mandelGrundierenNoetig = true;
  mandelPhase = 0;
}

/*
 * Die Iterationsschleife fuer einen einzelnen Punkt.
 *
 * Rueckgabe ist der Wert, wie er im Speicher steht: positiv der geglaettete
 * Iterationswert mu (aussen), negativ -1 minus der kleinste erreichte Betrag
 * (innen). Ein Wert, zwei Bedeutungen - so passt das ganze Bild in einen
 * einzigen Float32Array, und das Einfaerben braucht nur ein Vorzeichen zu
 * pruefen.
 */
function mandelBahn(cr, ci, schritte) {
  let zr = 0;
  let zi = 0;
  let zr2 = 0;
  let zi2 = 0;
  let n = 0;
  // Periodenpruefung: Punkte im Inneren entkommen nie und kosten sonst jede
  // Iteration. Wiederholt sich z, ist der Punkt gefangen. Der Bezugswert wird
  // in immer groesseren Abstaenden erneuert - so findet die Pruefung auch
  // lange Perioden, ohne staendig zu vergleichen.
  let bezugR = 0;
  let bezugI = 0;
  let seit = 0;
  let grenze = 8;
  let gefangen = false;
  // Wie nah kommt die Bahn dem Ursprung? Bei gefangenen Punkten ist das ein
  // Mass fuer die Lage im Inneren - daraus werden weiche Hoehenlinien.
  let kleinster = 1e9;

  while (n < schritte && zr2 + zi2 < 65536) {
    zi = 2 * zr * zi + ci;
    zr = zr2 - zi2 + cr;
    zr2 = zr * zr;
    zi2 = zi * zi;
    n++;
    if (zr2 + zi2 < kleinster) kleinster = zr2 + zi2;

    if (Math.abs(zr - bezugR) < 1e-13 && Math.abs(zi - bezugI) < 1e-13) {
      gefangen = true;
      break;
    }
    if (++seit >= grenze) {
      seit = 0;
      grenze += grenze;
      bezugR = zr;
      bezugI = zi;
    }
  }

  if (gefangen || n >= schritte) return -1 - Math.sqrt(kleinster);
  return n + 1 - Math.log(Math.log(Math.sqrt(zr2 + zi2))) / Math.LN2;
}

/*
 * Ein Streumuster fuer die Auffrischung: 8x8 Felder, jede Zahl genau einmal.
 *
 * Warum kein einfaches "jede achte Zeile": Eine Zeile faellt als Zeile auf.
 * Beim geordneten Streumuster (nach Bayer) liegen die frischen Punkte eines
 * Durchgangs so weit wie moeglich auseinander - der Blick findet kein Muster,
 * und das Bild wird gleichmaessig schaerfer statt streifenweise.
 */
const MANDEL_MUSTER = (() => {
  const n = 8;
  const feld = new Uint8Array(n * n);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      let wert = 0;
      let bit = 0;
      let xx = x ^ y;
      let yy = y;
      for (let s = n >> 1; s > 0; s >>= 1) {
        wert |= ((yy & s) ? 1 : 0) << bit++;
        wert |= ((xx & s) ? 1 : 0) << bit++;
      }
      feld[y * n + x] = wert;
    }
  }
  return feld;
})();

/**
 * Eine Phase des Streumusters neu rechnen. Gibt zurueck, wieviele Punkte das
 * waren - die Zahl geht in die Abnahme.
 */
function mandelAuffrischen(phase, linksC, obenC, schrittX, schrittY, schritte) {
  const werte = mandelWerte;
  let gerechnet = 0;
  for (let py = 0; py < MANDEL_HOEHE; py++) {
    const ci = obenC + py * schrittY;
    const zeile = (py & 7) * 8;
    const reihe = py * MANDEL_BREITE;
    for (let px = 0; px < MANDEL_BREITE; px++) {
      if (MANDEL_MUSTER[zeile + (px & 7)] !== phase) continue;
      werte[reihe + px] = mandelBahn(linksC + px * schrittX, ci, schritte);
      gerechnet++;
    }
  }
  return gerechnet;
}

/**
 * Das vorige Bild auf die neue Tiefe strecken.
 *
 * Ein Zoom auf einen festen Mittelpunkt ist eine reine Streckung um die Mitte,
 * und weil hineingezoomt wird, liegt jeder Punkt des neuen Bildes im alten
 * bereits drin. Es gibt also keinen Rand nachzurechnen - nur nachzuschaerfen,
 * und das erledigt die Auffrischung.
 */
function mandelStrecken(faktor, linksC, obenC, schrittX, schrittY, schritte) {
  if (!(faktor > 1.0000001)) return;
  const alt = mandelWerte;
  const neu = mandelWerteAlt;
  const mx = MANDEL_BREITE / 2;
  const my = MANDEL_HOEHE / 2;
  const eins = 1 / faktor;
  /*
   * Zwischen den Nachbarn wird gemischt, nicht der naechste genommen.
   *
   * Der naechste Nachbar war der erste Versuch und sah schrecklich aus: Ein
   * Punkt, der sechzehn Bilder lang nicht neu gerechnet wird, wird sechzehnmal
   * hintereinander umkopiert, und jedes Mal wird auf ein ganzes Feld gerundet.
   * Diese Rundungen addieren sich zu einem Zufallsweg von ein bis zwei Feldern
   * - am Rand des Fraktals, wo zwei benachbarte Punkte voellig verschiedene
   * Werte haben, wird daraus Rauschen. Nachgemessen: ein Teppich aus
   * flimmernden Kloetzchen statt eines Fraktals.
   *
   * Beim Mischen gibt es keine Rundung, also auch keinen Zufallsweg. Was
   * bleibt, ist eine leichte Unschaerfe in den Bereichen, die gerade nicht
   * dran waren - und die sieht wie die Bewegungsunschaerfe eines schnellen
   * Zooms aus, also nach Absicht.
   *
   * Innen und aussen werden nie miteinander verrechnet: Die beiden Werte
   * bedeuten Verschiedenes und liegen auf verschiedenen Seiten der Null. Wo
   * die vier Nachbarn sich nicht einig sind, liegt der Punkt genau auf dem
   * Rand der Menge - und dort wird nicht geschaetzt, sondern gerechnet. Das
   * ist wenig Arbeit (der Rand ist duenn) und trifft genau die Stellen, auf
   * die man schaut. Erst wenn das Randbudget aufgebraucht ist, gilt
   * ersatzweise der naechste Nachbar.
   */
  let randbudget = MANDEL_RANDBUDGET;
  let gerechnet = 0;
  const breite = MANDEL_BREITE;
  const hoehe = MANDEL_HOEHE;
  for (let py = 0; py < hoehe; py++) {
    const fy = my + (py + 0.5 - my) * eins - 0.5;
    let y0 = Math.floor(fy);
    const ty = fy - y0;
    if (y0 < 0) y0 = 0;
    else if (y0 > hoehe - 1) y0 = hoehe - 1;
    let y1 = y0 + 1;
    if (y1 > hoehe - 1) y1 = hoehe - 1;
    const oben = y0 * breite;
    const unten = y1 * breite;
    const ziel = py * breite;
    for (let px = 0; px < breite; px++) {
      const fx = mx + (px + 0.5 - mx) * eins - 0.5;
      let x0 = Math.floor(fx);
      const tx = fx - x0;
      if (x0 < 0) x0 = 0;
      else if (x0 > breite - 1) x0 = breite - 1;
      let x1 = x0 + 1;
      if (x1 > breite - 1) x1 = breite - 1;

      const lo = alt[oben + x0];
      const ro = alt[oben + x1];
      const lu = alt[unten + x0];
      const ru = alt[unten + x1];
      const aussen = lo > 0;
      if (aussen === ro > 0 && aussen === lu > 0 && aussen === ru > 0) {
        const o = lo + (ro - lo) * tx;
        const u = lu + (ru - lu) * tx;
        neu[ziel + px] = o + (u - o) * ty;
      } else if (randbudget > 0) {
        randbudget--;
        gerechnet++;
        neu[ziel + px] = mandelBahn(linksC + px * schrittX, obenC + py * schrittY, schritte);
      } else {
        neu[ziel + px] = tx < 0.5 ? (ty < 0.5 ? lo : lu) : ty < 0.5 ? ro : ru;
      }
    }
  }
  mandelWerte = neu;
  mandelWerteAlt = alt;
  return gerechnet;
}

/**
 * Nach einem Stellenwechsel den ganzen Speicher grob fuellen.
 *
 * Jeden Punkt zu rechnen waere hier ein Ruckler von deutlich ueber 50 ms. Also
 * wird nur jeder vierte in beiden Richtungen gerechnet und sein Wert in den
 * 4x4-Block geschrieben - ein Sechzehntel der Arbeit. Die Auffrischung holt
 * die Feinheit in den naechsten Bildern nach, und das alles geschieht unter
 * dem Blitz, der den Stellenwechsel deckt.
 */
function mandelGrundieren(linksC, obenC, schrittX, schrittY, schritte) {
  const werte = mandelWerte;
  const grob = Math.min(schritte, 260);
  for (let py = 0; py < MANDEL_HOEHE; py += 4) {
    const ci = obenC + py * schrittY;
    for (let px = 0; px < MANDEL_BREITE; px += 4) {
      const wert = mandelBahn(linksC + px * schrittX, ci, grob);
      const bisY = Math.min(py + 4, MANDEL_HOEHE);
      const bisX = Math.min(px + 4, MANDEL_BREITE);
      for (let y = py; y < bisY; y++) {
        const reihe = y * MANDEL_BREITE;
        for (let x = px; x < bisX; x++) werte[reihe + x] = wert;
      }
    }
  }
}

/*
 * Wie aus Musik ein Bild wird.
 *
 * Der Anspruch ist nicht "es zuckt, wenn es laut ist". Das kann jeder
 * Pegelbalken, und nach zwei Minuten sieht man weg. Was hier gebaut ist, folgt
 * dem Grundsatz, nach dem Klang-Bild-Zuordnungen ueberhaupt funktionieren:
 * Voneinander unabhaengige Groessen der Musik muessen auf voneinander
 * unabhaengige Groessen des Bildes gehen. Sonst laufen alle Anzeigen im
 * Gleichtakt, und aus fuenf Aussagen wird eine.
 *
 * Fuenf Groessen, fuenf Wege:
 *
 *   Takt          -> Farbwanderung.  Genau ein Durchlauf der Farbtabelle je
 *                    Takt, nicht ungefaehr: Die Phase kommt aus dem Raster der
 *                    Analyse, nicht aus einem erkannten Anschlag. Damit
 *                    marschieren die Farbbaender exakt im Tempo des Stuecks.
 *   Kick / Bass   -> Vorstoss des Zooms. Ein Stoss je Schlag, gewichtet nach
 *                    dem Pegel im untersten Band.
 *   Spektrum      -> Helligkeit der einzelnen Baender (siehe Farbtabelle).
 *   Spannung      -> Drehung *und* Banddichte. Je naeher der Drop, desto
 *                    schneller der Strudel und desto enger die Ringe. Beides
 *                    zieht sich sichtbar zusammen - das ist die Vorbereitung,
 *                    die ein Zuschauer spuert, bevor er sie benennen kann.
 *   Drop          -> Ein Ruck in Drehung, Zoom und Farbe zugleich.
 *
 * Der Takt ist dabei der wichtigste Kanal, und zwar wegen der Genauigkeit:
 * Was auf wenige Hundertstelsekunden mit der Musik zusammenfaellt, liest das
 * Auge als "dazu gehoerig". Was um eine Zehntelsekunde daneben liegt, liest es
 * als zwei Dinge, die zufaellig gleichzeitig passieren. Deshalb kommt die
 * Phase aus dem Raster und nicht aus einer Erkennung im Signal.
 */
// Fuer die Abnahme: den Stellenwechsel von aussen ausloesen. Er kommt im
// Betrieb nur alle paar Minuten vor, und eine Pruefung, die darauf wartet,
// prueft ihn nie.
if (typeof window !== 'undefined') window.__mandelNeuAnsetzen = () => mandelNeuAnsetzen();

function mandelbrotZeichnen(stift, lage) {
  const {
    breite, hoehe, sekunden, takt, spektrum, spannung, wucht, drop,
    palette: paletteA, paletteB, anteilB,
  } = lage;

  // --- Die Fahrt ---------------------------------------------------------

  if (takt && takt.nummer !== mandelLetzterBeat) {
    mandelLetzterBeat = takt.nummer;
    mandelSchwung += 0.3 + wucht * 0.6 + (takt.aufEins ? 0.4 : 0);
  }
  mandelSchwung *= Math.pow(0.08, sekunden);

  if (drop) {
    mandelSchwung += 12;
    mandelDrehTempo += 1.6;
    mandelFarbSprung += 0.3;
  }

  /*
   * Vor dem Drop zieht es an. Die Spannung kommt aus der Analyse und steigt,
   * je naeher der Drop rueckt.
   *
   * Der Schlagstoss geht bewusst nur mit einem kleinen Faktor ein. Mit 0,55
   * bestimmte er die Fahrt: nachgemessen 0,33 Zehnerpotenzen je Sekunde statt
   * der vorgesehenen 0,055 - der Grundzoom war nur noch Beiwerk, und die Tiefe
   * war nach anderthalb Minuten am Ende. Ein Puls soll das Tempo *atmen*
   * lassen, nicht setzen. Mit 0,07 hebt ein Schlag das Tempo kurz um gut die
   * Haelfte an, im Mittel aber nur um ein Drittel des Grundwerts.
   */
  const tempo = MANDEL_GRUNDZOOM * (1 + spannung * 2.2) + mandelSchwung * 0.07;
  mandelTiefe += tempo * sekunden;

  // Die Drehung: eine ruhige Grundbewegung, die mit der Spannung anzieht, plus
  // der Ruck vom Drop, der wieder ausklingt.
  mandelDrehTempo *= Math.pow(0.25, sekunden);
  mandelDrehung += (0.035 + spannung * 0.22 + mandelDrehTempo) * sekunden;

  /*
   * Die Farbwanderung haengt am Raster, nicht an der Uhr.
   *
   * takt.beat ist die fortlaufende Schlagnummer mit Nachkommastelle. Durch
   * acht geteilt ergibt das genau einen Durchlauf der Farbtabelle je zwei
   * Takte - eine Bewegung, die nicht nur ungefaehr zum Tempo passt, sondern
   * mit ihm identisch ist, und die sich an jeder Taktgrenze im selben Zustand
   * wiederfindet. Ohne Raster laeuft eine ruhige Grundbewegung weiter, damit
   * im Leerlauf nicht das Bild einfriert.
   *
   * Ein Durchlauf je *Takt* war der erste Versuch und zu schnell: Bei 126
   * Schlaegen wanderte die ganze Tabelle in unter zwei Sekunden durch, das
   * Bild flirrte dauernd, und der Drop ging darin unter - nachgemessen
   * aenderte sich das Bild im Leerlauf schon um 33 Helligkeitsstufen je
   * Messschritt, beim Drop um 37. Wer immer schreit, kann nicht lauter
   * werden.
   */
  if (takt) {
    mandelFarbe = mandelFarbSprung - takt.beat / 8;
  } else {
    mandelFarbe -= sekunden * 0.12;
  }

  // Die Genauigkeit ist am Ende. Auf der Grafikkarte passiert das selten
  // genug, dass eine ruhige Ueberblendung reicht; ohne sie waere hier ein
  // Sprung.
  if (mandelTiefe > (mandelAufGpu ? MANDEL_MAX_TIEFE_GPU : MANDEL_MAX_TIEFE)) {
    mandelNeuAnsetzen();
  }

  // --- Die Farbtabelle, fuer beide Wege dieselbe --------------------------

  const grundton = paletteB && anteilB > 0.5 ? paletteB.grundton : paletteA.grundton;
  // Jedes Bild neu: Sie traegt jetzt das Spektrum, und das aendert sich mit
  // jedem Bild. 512 Stufen kosten weniger als ein Zehntel einer Millisekunde.
  mandelFarbtabelle = mandelTabelleBauen(grundton, spektrum, 0.6 + wucht * 0.6);
  mandelFarbtonZuletzt = grundton;

  const stufe = GUETESTUFEN[lage.guetestufe] ?? GUETESTUFEN.hoch;
  const versatzJetzt = mandelFarbe - Math.floor(mandelFarbe);
  // Enger werdende Ringe, je naeher der Drop. Das ist die zweite Haelfte der
  // Vorbereitung - die erste ist die Drehung.
  const dichte = 0.85 + spannung * 0.85;

  // --- Der schnelle Weg: Grafikkarte --------------------------------------

  if (mandelAufGpu === null) mandelAufGpu = gpuBereit();
  if (mandelAufGpu) {
    const begonnenGpu = performance.now();
    const zielGpu = MANDEL_ZIELE[mandelZiel];
    /*
     * Die Schrittzahl waechst mit der Tiefe. Anders als beim Hauptprozessor
     * gibt es hier keine Obergrenze aus Genauigkeitsgruenden - nur eine aus
     * Zeitgruenden, und die regelt der Guetefaktor mit.
     */
    const schritteGpu = Math.round(Math.min(4600, 420 + mandelTiefe * 150 + spannung * 220));
    gpuFarben(mandelFarbtabelle);
    const bild = gpuZeichnen({
      breite, hoehe,
      ziel: zielGpu,
      tiefe: mandelTiefe,
      dreh: mandelDrehung,
      schritte: schritteGpu,
      versatz: versatzJetzt,
      dichte,
      innenHell: 0.4 + wucht * 0.35,
      guete: Math.min(mandelGuete, stufe.fraktal),
    });
    mandelPunkte = bild.breite * bild.hoehe;

    if (typeof window !== 'undefined') {
      window.__mandel = {
        tiefe: mandelTiefe,
        ziel: zielGpu.name,
        zielNummer: mandelZiel,
        neuangesetzt: mandelNeuangesetzt,
        blitz: mandelUeberblendung,
        ueberblendung: mandelUeberblendung,
        schritte: schritteGpu,
        breite: bild.breite,
        guete: Math.min(mandelGuete, stufe.fraktal),
        dreh: mandelDrehung,
        dichte,
        versatz: versatzJetzt,
        aufGpu: true,
        dauerMs: mandelDauer,
        schwung: mandelSchwung,
      };
    }

    mandelAufsBild(stift, bild.leinwand, bild.breite, bild.hoehe, breite, hoehe, wucht, sekunden);

    const gebrauchtGpu = Math.max(0.2, performance.now() - begonnenGpu);
    mandelDauer =
      gebrauchtGpu > mandelDauer
        ? mandelDauer * 0.4 + gebrauchtGpu * 0.6
        : mandelDauer * 0.88 + gebrauchtGpu * 0.12;
    // Derselbe Regler wie beim Hauptprozessor, nur an einem anderen Knopf: Hier
    // ist es die Aufloesung, mit der gerechnet wird. Auf einer richtigen
    // Grafikkarte steht er bei 1 und ruehrt sich nicht; auf einer Notloesung
    // in Software faellt er, und das Bild wird weicher statt ruckelig.
    /*
     * Nach unten darf der Regler viel weiter greifen als nach oben.
     *
     * Mit einer Schranke von 0,86 nach unten brauchte er bei einem Bild von
     * einer Sekunde rund zwanzig Bilder, bis er unten ankam - zwanzig Bilder,
     * die alle eine Sekunde dauerten. Nach oben bleibt er vorsichtig, damit er
     * nicht ueberschwingt; nach unten muss er springen koennen.
     */
    const regelGpu = Math.min(1.06, Math.max(0.5, Math.sqrt(stufe.budget / Math.max(1, mandelDauer))));
    /*
     * Die Obergrenze liegt bei 2, nicht bei 1.
     *
     * Ueber der Bildschirmaufloesung zu rechnen und beim Zeichnen zu
     * verkleinern ist Ueberabtastung: vier gerechnete Punkte je gezeigtem.
     * Genau das braucht ein Fraktal, dessen Baender in der Tiefe feiner werden
     * als ein Bildpunkt. Auf einer richtigen Grafikkarte steht der Regler
     * deshalb oben und rechnet vierfach; wo die Kraft fehlt, faellt er unter 1
     * und das Bild wird weicher statt ruckelig.
     */
    mandelGuete = Math.min(stufe.fraktal, Math.max(MANDEL_GUETE_MIN, mandelGuete * regelGpu));

    /*
     * Der Notausgang.
     *
     * Steht der Regler unten und das Bild braucht trotzdem noch ein
     * Vielfaches seines Budgets, dann ist da keine Grafikkarte, sondern ein
     * Nachbau in Software - so laeuft es zum Beispiel in der Abnahme, wo
     * gemessene 900 ms je Bild herauskamen. In dem Fall ist die Fassung auf
     * dem Hauptprozessor die bessere: weniger Tiefe, aber fluessig. Nach
     * zwanzig aufeinanderfolgenden zu langsamen Bildern wird umgeschaltet und
     * nicht mehr zurueck - ein Hin und Her waere schlimmer als beide Fassungen
     * einzeln.
     */
    if (mandelDauer > stufe.budget * 4 + 12 && mandelGuete <= MANDEL_GUETE_MIN * 1.05) mandelGpuZaeh++;
    else mandelGpuZaeh = 0;
    if (mandelGpuZaeh > 3) {
      mandelAufGpu = false;
      mandelTiefe = Math.min(mandelTiefe, MANDEL_MAX_TIEFE - 0.5);
      mandelGrundierenNoetig = true;
      mandelDauer = 8;
      if (typeof console !== 'undefined') {
        console.warn('Mandelbrot: Grafikkarte zu langsam, zurueck auf den Hauptprozessor.');
      }
    }
    return;
  }

  // --- Speicher und Regler -----------------------------------------------
  //
  // Leinwand, Bildspeicher und Wertespeicher werden *einmal* angelegt.
  //
  // Vorher wurde bei jeder Aufloesungsaenderung ein neues Canvas samt
  // ImageData erzeugt. Weil der Regler die Aufloesung staendig leicht
  // nachzog, passierte das dauernd - und jede dieser Neuanlagen war ein
  // Ausreisser von ueber 40 ms mitten im laufenden Bild.
  if (!mandelLeinwand) {
    MANDEL_BREITE = stufe.rechen;
    MANDEL_HOEHE = Math.round((stufe.rechen * 5) / 8);
    MANDEL_PUNKTE = MANDEL_BREITE * MANDEL_HOEHE;
    mandelLeinwand = document.createElement('canvas');
    mandelLeinwand.width = MANDEL_BREITE;
    mandelLeinwand.height = MANDEL_HOEHE;
    mandelStift = mandelLeinwand.getContext('2d');
    mandelBild = mandelStift.createImageData(MANDEL_BREITE, MANDEL_HOEHE);
    mandelWerte = new Float32Array(MANDEL_PUNKTE).fill(-1);
    mandelWerteAlt = new Float32Array(MANDEL_PUNKTE).fill(-1);
  }

  /*
   * Die Schrittzahl waechst mit der Tiefe - je naeher am Rand, desto laenger
   * braucht ein Punkt, um sich zu entscheiden. Die Obergrenze deckelt den
   * schlimmsten Fall: An manchen Stellen laeuft fast jeder Punkt bis zum
   * Anschlag, und die Rechenzeit schwankt mit dem Bildinhalt um das
   * Fuenffache. Sichtbar kostet der Deckel wenig, seit die Innenflaeche ihre
   * eigene Zeichnung hat - ein Punkt, der die Grenze erreicht, wird nicht
   * schwarz, sondern bekommt eine Hoehenlinie.
   *
   * Der Blitz erhoeht die Schrittzahl bewusst *nicht*: Im Bild eines
   * Stellenwechsels wird ohnehin grundiert, das ist teuer genug.
   */
  const schritte = Math.round(
    Math.min(760, 200 + mandelTiefe * 84 + wucht * 90 + spannung * 70),
  );

  /*
   * Der Regler haengt an der *gemessenen* Zeit, nicht an einem Kostenmodell
   * aus Punkten mal Schritten.
   *
   * Das Modell hatte einen Denkfehler: Mit der Periodenpruefung kostet ein
   * Punkt im Inneren viel weniger als einer am Rand, und wie viele davon im
   * Bild sind, weiss man vorher nicht. Ein Bild mit viel Innenflaeche lief
   * schnell, das Modell schloss auf einen schnellen Rechner, gab mehr frei -
   * und das naechste Bild lag am Rand und brauchte 62 ms.
   *
   * Geregelt wird jetzt nicht mehr die Aufloesung, sondern wieviel vom Bild
   * je Bild aufgefrischt wird. Das ist der bessere Knopf: Zu wenig Zeit macht
   * das Bild nicht grob, sondern nur ein wenig aelter.
   */
  const nachregeln = Math.min(1.12, Math.max(0.78, Math.sqrt(stufe.budget / Math.max(1, mandelDauer))));
  mandelPhasenProBild = Math.min(16, Math.max(0.6, mandelPhasenProBild * nachregeln));


  // --- Die Rechnung ------------------------------------------------------

  const begonnen = performance.now();
  const zielPunkt = MANDEL_ZIELE[mandelZiel];
  const spanne = 1.6 / Math.pow(10, mandelTiefe);
  const seitenverhaeltnis = MANDEL_HOEHE / MANDEL_BREITE;
  const schrittX = (2 * spanne) / MANDEL_BREITE;
  const schrittY = (2 * spanne * seitenverhaeltnis) / MANDEL_HOEHE;
  const linksC = zielPunkt.zx - spanne + schrittX * 0.5;
  const obenC = zielPunkt.zy - spanne * seitenverhaeltnis + schrittY * 0.5;

  if (mandelGrundierenNoetig) {
    mandelGrundieren(linksC, obenC, schrittX, schrittY, schritte);
    mandelGrundierenNoetig = false;
    mandelTiefeGezeichnet = mandelTiefe;
    mandelFrischePunkte = MANDEL_PUNKTE >> 4;
  } else {
    // 1. Das vorige Bild auf die neue Tiefe strecken.
    const amRand = mandelStrecken(
      Math.pow(10, mandelTiefe - mandelTiefeGezeichnet),
      linksC, obenC, schrittX, schrittY, schritte,
    );
    mandelTiefeGezeichnet = mandelTiefe;
    // 2. Einen Teil der Punkte wirklich neu rechnen.
    mandelPhasenKonto += mandelPhasenProBild;
    let phasen = Math.floor(mandelPhasenKonto);
    mandelPhasenKonto -= phasen;
    if (phasen > MANDEL_PHASEN) phasen = MANDEL_PHASEN;
    mandelFrischePunkte = amRand;
    for (let i = 0; i < phasen; i++) {
      mandelFrischePunkte += mandelAuffrischen(
        mandelPhase, linksC, obenC, schrittX, schrittY, schritte,
      );
      mandelPhase = (mandelPhase + 1) % MANDEL_PHASEN;
    }
  }

  // --- Das Einfaerben ------------------------------------------------------
  //
  // Ein eigener Durchlauf ueber alle Punkte, jedes Bild. Er kostet wenig - je
  // Punkt ein Tabellenzugriff - und er ist der Grund, warum die Farben im
  // Takt wandern koennen, ohne dass ein einziger Punkt neu gerechnet wird.
  // Nebenbei faellt hier alles an, was ueber das Bild als Ganzes gesagt werden
  // muss: Wertebereich, Innenanteil und wieviele Farbstufen benutzt sind.

  const daten = mandelBild.data;
  const tabelle = mandelFarbtabelle;
  const farbversatz = mandelFarbe * 512;
  // Die Faecherbreite folgt dem Wertebereich des vorigen Bildes; welche Farbe
  // ein Fach bekommt, entscheidet dann die Summenkurve.
  const muFaktor = MANDEL_FAECHER / mandelMuSpanne;
  const innenFaktor = MANDEL_FAECHER / mandelInnenSpanne;
  const bogen = MANDEL_FARBZYKLEN * 512;
  const werte = mandelWerte;
  let innen = 0;
  let muTiefst = Infinity;
  let muHoechst = -Infinity;
  let innenTiefst = Infinity;
  let innenHoechst = -Infinity;
  // Wie stark sich benachbarte Punkte unterscheiden. Das ist das ehrlichste
  // Mass dafuer, ob ueberhaupt eine Zeichnung im Bild steht - die Zahl der
  // benutzten Farbstufen ist es nicht, seit die Verteilung gleichgemacht wird.
  let kantenSumme = 0;
  let vorigerIndex = 0;
  mandelBelegt.fill(0);
  mandelHistogramm.fill(0);
  mandelInnenHistogramm.fill(0);

  for (let i = 0, k = 0; i < MANDEL_PUNKTE; i++, k += 4) {
    const wert = werte[i];
    let index;
    if (wert > 0) {
      const mu = wert;
      if (mu < muTiefst) muTiefst = mu;
      if (mu > muHoechst) muHoechst = mu;
      let fach = (mu - mandelMuTief) * muFaktor;
      fach = fach < 0 ? 0 : fach > 255.999 ? 255.999 : fach;
      const f0 = fach | 0;
      mandelHistogramm[f0]++;
      const rang = mandelKurve[f0] + (mandelKurve[f0 + 1] - mandelKurve[f0]) * (fach - f0);
      index = Math.floor(rang * bogen + farbversatz) % 512;
      if (index < 0) index += 512;
      mandelBelegt[index >> 5] |= 1 << (index & 31);
      const t = index * 3;
      daten[k] = tabelle[t];
      daten[k + 1] = tabelle[t + 1];
      daten[k + 2] = tabelle[t + 2];
      daten[k + 3] = 255;
    } else {
      innen++;
      /*
       * Das Innere war einmal schwarz, und das war ein Fehler: Faehrt die
       * Fahrt durch eine grosse Bucht der Menge, stand minutenlang ein fast
       * leeres Bild da - nachgemessen bis auf 0,2 Prozent nicht schwarze
       * Punkte herunter. Der kleinste Betrag, den die Bahn erreicht hat,
       * unterscheidet die Punkte im Inneren voneinander und gibt auch der
       * Innenflaeche eine Zeichnung.
       */
      const naehe = -wert - 1;
      if (naehe < innenTiefst) innenTiefst = naehe;
      if (naehe > innenHoechst) innenHoechst = naehe;
      let fach = (naehe - mandelInnenTief) * innenFaktor;
      fach = fach < 0 ? 0 : fach > 255.999 ? 255.999 : fach;
      const f0 = fach | 0;
      mandelInnenHistogramm[f0]++;
      const rang =
        mandelInnenKurve[f0] + (mandelInnenKurve[f0 + 1] - mandelInnenKurve[f0]) * (fach - f0);
      const stufe = Math.floor(rang * 380);
      index = stufe;
      mandelBelegt[stufe >> 5] |= 1 << (stufe & 31);
      const i2 = stufe * 3;
      // Haelfte statt Viertel: Mit einem Viertel war die Innenflaeche zwar
      // nicht mehr schwarz, aber immer noch fast einfarbig - nachgemessen
      // 2,5 Helligkeitsstufen Streuung in einem Bild, das ganz aus Innerem
      // bestand. Dunkel genug fuer Hintergrund bleibt es auch so.
      daten[k] = 6 + (tabelle[i2] >> 1);
      daten[k + 1] = 6 + (tabelle[i2 + 1] >> 1);
      daten[k + 2] = 8 + (tabelle[i2 + 2] >> 1);
      daten[k + 3] = 255;
    }
    // Abstand zum linken Nachbarn, ueber den Ring gemessen.
    let d = index - vorigerIndex;
    if (d < 0) d = -d;
    kantenSumme += d > 256 ? 512 - d : d;
    vorigerIndex = index;
  }

  mandelKanten = kantenSumme / MANDEL_PUNKTE;
  mandelKurveBauen(mandelHistogramm, mandelKurve);
  mandelKurveBauen(mandelInnenHistogramm, mandelInnenKurve);

  /*
   * Den Wertebereich fuer das naechste Bild nachfuehren - traege, damit die
   * Farben beim Zoomen wandern statt zu zappeln, und mit einer Untergrenze:
   * Bei einem Bild, in dem wirklich alles gleich ist, wuerde eine Spanne von
   * fast null das Rauschen bis zur Unkenntlichkeit aufblasen.
   */
  if (muHoechst > muTiefst) {
    mandelMuTief += (muTiefst - mandelMuTief) * 0.18;
    mandelMuSpanne += (Math.max(4, muHoechst - muTiefst) - mandelMuSpanne) * 0.18;
  }
  if (innenHoechst > innenTiefst) {
    mandelInnenTief += (innenTiefst - mandelInnenTief) * 0.18;
    mandelInnenSpanne += (Math.max(0.02, innenHoechst - innenTiefst) - mandelInnenSpanne) * 0.18;
  }

  // Bits zaehlen (Kernighan: jeder Durchlauf loescht das unterste gesetzte).
  mandelVielfalt = 0;
  for (let w = 0; w < 16; w++) {
    let v = mandelBelegt[w];
    while (v) {
      v &= v - 1;
      mandelVielfalt++;
    }
  }

  /*
   * Ist fast alles Innenflaeche oder benutzt das Bild kaum noch Farbstufen,
   * steht da keine Zeichnung mehr. Das passiert, wenn die Fahrt in eine grosse
   * Bucht der Menge geraet oder wenn die Genauigkeit an einer Stelle frueher
   * endet als erwartet - kein Fehler, nur eine tote Stelle. Statt dort zu
   * verharren, wird weitergezogen, gedeckt vom selben Blitz wie beim
   * Genauigkeitsende.
   *
   * Eine halbe Sekunde Geduld war zu lang: Nachgemessen stand kurz vor so
   * einem Wechsel ein Bild mit 2,6 Helligkeitsstufen Streuung.
   */
  const innenAnteil = innen / MANDEL_PUNKTE;
  if (innenAnteil > 0.8 || mandelKanten < MANDEL_KANTEN_MIN) mandelLeerlauf += sekunden;
  else mandelLeerlauf = 0;
  if (mandelLeerlauf > 0.22) {
    mandelLeerlauf = 0;
    mandelNeuAnsetzen();
  }
  // Fuer die Abnahme sichtbar machen, was die Fahrt gerade tut.
  if (typeof window !== 'undefined') {
    window.__mandel = {
      tiefe: mandelTiefe,
      ziel: zielPunkt.name,
      zielNummer: mandelZiel,
      neuangesetzt: mandelNeuangesetzt,
      blitz: mandelUeberblendung,
      ueberblendung: mandelUeberblendung,
      schritte,
      breite: MANDEL_BREITE,
      frischePunkte: mandelFrischePunkte,
      phasenProBild: mandelPhasenProBild,
      innenAnteil,
      // Auf dem Hauptprozessor wird nicht gedreht - die Streckung des
      // Wertespeichers setzt einen reinen Zoom voraus. Hier steht deshalb
      // nichts und nicht etwa eine Null, die eine Drehung vortaeuschte.
      dreh: null,
      versatz: mandelFarbe - Math.floor(mandelFarbe),
      muSpanne: mandelMuSpanne,
      vielfalt: mandelVielfalt,
      kanten: mandelKanten,
      dauerMs: mandelDauer,
      schwung: mandelSchwung,
    };
  }

  // Nur den genutzten Ausschnitt uebertragen.
  mandelStift.putImageData(mandelBild, 0, 0);
  const gebraucht = Math.max(0.2, performance.now() - begonnen);
  // Ungleich geglaettet: Ein langsames Bild schlaegt sofort durch, damit die
  // Aufloesung im naechsten Bild faellt. Ein schnelles wird nur langsam
  // geglaubt - sonst wird nach jedem billigen Bild zu viel freigegeben und
  // das uebernaechste ruckelt.
  mandelDauer =
    gebraucht > mandelDauer
      ? mandelDauer * 0.4 + gebraucht * 0.6
      : mandelDauer * 0.88 + gebraucht * 0.12;

  // --- Aufs Bild --------------------------------------------------------

  mandelAufsBild(stift, mandelLeinwand, MANDEL_BREITE, MANDEL_HOEHE, breite, hoehe, wucht, sekunden);
}

/*
 * Das fertige Fraktal auf den Bildschirm bringen - fuer beide Wege dieselbe
 * Stelle, damit Ueberblendung und Schleier nicht zweimal dastehen und
 * auseinanderlaufen.
 */
function mandelAufsBild(stift, quelle, qb, qh, breite, hoehe, wucht, sekunden) {
  stift.save();
  stift.imageSmoothingEnabled = true;
  stift.imageSmoothingQuality = 'high';
  const deckung = 0.92 + wucht * 0.08;
  stift.globalAlpha = deckung;
  stift.drawImage(quelle, 0, 0, qb, qh, 0, 0, breite, hoehe);

  /*
   * Die Ueberblendung beim Stellenwechsel.
   *
   * Das alte Bild liegt noch im Schnappschuss und wird darueber gelegt, mit
   * abnehmender Deckung. Beide Bilder sind Zoomfahrten in dieselbe Richtung,
   * also passt die Bewegung zusammen; was man sieht, ist ein Durchgleiten,
   * kein Schnitt. Der Schnappschuss ist absichtlich klein - waehrend der
   * Ueberblendung verschwindet er ohnehin, da faellt keine Schaerfe auf, und
   * so kostet er in jedem Bild nur eine winzige Kopie.
   */
  if (mandelUeberblendung > 0 && mandelSchnappschuss) {
    stift.globalAlpha = mandelUeberblendung * deckung;
    stift.drawImage(
      mandelSchnappschuss, 0, 0, mandelSchnappschuss.width, mandelSchnappschuss.height,
      0, 0, breite, hoehe,
    );
    mandelUeberblendung = Math.max(0, mandelUeberblendung - sekunden / MANDEL_UEBERBLEND);
  } else {
    // Auffrischen, solange nicht ueberblendet wird - dann liegt beim naechsten
    // Wechsel immer das unmittelbar vorige Bild bereit.
    if (!mandelSchnappschuss) {
      mandelSchnappschuss = document.createElement('canvas');
      mandelSchnappschuss.width = 480;
      mandelSchnappschuss.height = 300;
      mandelSchnappStift = mandelSchnappschuss.getContext('2d');
    }
    mandelSchnappStift.drawImage(quelle, 0, 0, qb, qh, 0, 0, 480, 300);
    mandelSchnappschussNehmen = false;
  }

  // Oben und unten abdunkeln. Dort stehen Titel, Uhr und Pegel, und ein
  // Fraktal in voller Pracht direkt dahinter macht beides unlesbar.
  stift.globalAlpha = 1;
  const schleier = stift.createLinearGradient(0, 0, 0, hoehe);
  schleier.addColorStop(0, 'rgba(0,0,0,0.62)');
  schleier.addColorStop(0.16, 'rgba(0,0,0,0.06)');
  schleier.addColorStop(0.66, 'rgba(0,0,0,0.06)');
  schleier.addColorStop(1, 'rgba(0,0,0,0.72)');
  stift.fillStyle = schleier;
  stift.fillRect(0, 0, breite, hoehe);
  stift.restore();
}

const MODI = {
  iris: { name: 'Iris', zeichne: irisZeichnen, schmuck: true },
  tunnel: { name: 'Tunnel', zeichne: tunnelZeichnen, schmuck: true },
  strahlen: { name: 'Strahlen', zeichne: strahlenZeichnen, schmuck: true },
  /*
   * Das Mandelbrot bekommt keinen Schmuck.
   *
   * Ringe auf jedem Schlag, Funken beim Drop und der Spannungsbogen in der
   * Mitte sind fuer die drei anderen Modi gebaut, die von Bewegung leben. Ueber
   * einer Zoomfahrt sind sie Stoerung: Das Auge folgt dem Sog nach innen, und
   * jeder Ring, der von der Mitte nach aussen laeuft, zieht es wieder heraus.
   * Genau die hypnotische Wirkung, um die es hier geht, wird davon zerstoert.
   */
  mandelbrot: { name: 'Mandelbrot', zeichne: mandelbrotZeichnen, schmuck: false },
};


// ===== public/gemeinsam/visual.js =====
// Die Visualisierung.
//
// Der Unterschied zu jedem gewoehnlichen Visualizer: Dieser hier *weiss, was
// kommt*. Tempo, Beatraster und die Position des Drops stehen in der Analyse.
// Also muss er nicht nur auf Lautstaerke zappeln, sondern kann sich aufbauen -
// sechzehn Takte vor dem Drop zieht sich alles zusammen, und im richtigen
// Moment platzt es auf. Ein Mensch mit Lichtpult macht genau das.
//
// Vier Schichten, von hinten nach vorne:
//
//   1. Lava      grosse, langsame Farbblasen. Additiv gezeichnet, damit sie
//                ineinanderlaufen wie in einer Lampe.
//   2. Iris      ein Ring in der Mitte, dessen Rand vom Frequenzband verformt
//                wird. Das Herz des Bildes.
//   3. Puls      Ringe auf jedem Beat, staerker auf der Eins, am staerksten
//                auf der Phrasengrenze.
//   4. Ausbruch  Schockwellen und Funken beim Drop.
//
// Nichts davon wiederholt sich exakt: Jeder Track bekommt seine eigene Palette
// aus seiner Kennung, und die Bewegung laeuft ueber langsames Rauschen, das nie
// denselben Weg nimmt.


// Die Reihenfolge, in der die Modi durchgewechselt werden. Nicht zufaellig
// gezogen, sondern reihum: So sieht man zwei gleiche nie hintereinander, und
// ueber einen Abend kommt jeder gleich oft dran.
const MODUSFOLGE = ['mandelbrot', 'iris', 'tunnel', 'strahlen'];

/**
 * Welcher Modus passt zu diesem Track?
 *
 * Reihum durchzuwechseln ist gerecht, aber nicht gut: Ein Strahlenkranz
 * braucht Percussion in den Hoehen, sonst steht er still, und eine Iris wirkt
 * auf einem Brett verloren. Also entscheidet, was der Track mitbringt - und
 * zwar aus denselben Zahlen, die auch die Uebergaenge planen.
 *
 * Der zuletzt gelaufene Modus wird ausgeschlossen. Zwei gleiche
 * hintereinander sehen aus wie ein Fehler, selbst wenn beide passen.
 */
function modusAusTrack(track, zuletzt) {
  const energie = track?.energie ?? 0.5;
  const profil = track?.profil ?? [];
  const mitte = profil.length ? profil[Math.floor(profil.length / 2)] : null;
  const hoehen = mitte?.h ?? 0.2;
  const dichte = mitte?.d ?? 2;

  const punkte = {
    // Das Fraktal traegt alles und wird mit der Energie nur intensiver. Es ist
    // die sichere Wahl und darf deshalb die hoechste Grundpunktzahl haben.
    mandelbrot: 0.6 + energie * 0.5,
    // Strahlen leben von Percussion in den Hoehen.
    strahlen: 0.2 + hoehen * 2.2 + Math.min(0.4, dichte * 0.12),
    // Der Tunnel braucht einen klaren Puls, keinen Teppich.
    tunnel: 0.35 + Math.max(0, 1 - Math.abs(dichte - 2.4) / 2.4) * 0.9,
    // Die Iris ist die ruhige Wahl.
    iris: 0.3 + Math.max(0, 0.7 - energie) * 1.4,
  };
  if (zuletzt) punkte[zuletzt] = -1;

  return Object.entries(punkte).sort((a, b) => b[1] - a[1])[0][0];
}

// --- Zufall, der sich wiederholen laesst ----------------------------------

function streuung(startwert) {
  let z = startwert >>> 0;
  return () => {
    z = (z * 1664525 + 1013904223) >>> 0;
    return z / 4294967296;
  };
}

function ausText(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// Weiches Rauschen ueber die Zeit. Sorgt fuer Bewegung, die driftet statt zu
// zappeln - der Unterschied zwischen "lebendig" und "nervoes".
function rauschen(startwert) {
  const wuerfel = streuung(startwert);
  const stuetzen = Array.from({ length: 256 }, wuerfel);
  return (t) => {
    const i = Math.floor(t);
    const a = t - i;
    const v0 = stuetzen[i % 256];
    const v1 = stuetzen[(i + 1) % 256];
    // Glatte Ueberblendung, damit keine Knicke entstehen.
    const s = a * a * (3 - 2 * a);
    return v0 + (v1 - v0) * s;
  };
}

// --- Farben ---------------------------------------------------------------

// Jeder Track bekommt seine eigene Palette, aber keine zufaellige: Der
// Grundton kommt aus der Kennung, die uebrigen Toene stehen in festen
// Abstaenden dazu. So sieht jeder Track anders aus und trotzdem nie schlecht.
function palette(kennung, energie = 0.5) {
  const wuerfel = streuung(ausText(kennung || 'ohne'));
  const grundton = Math.floor(wuerfel() * 360);
  // Mit steigender Energie waermer und gesaettigter.
  const saettigung = 62 + energie * 30;
  const helligkeit = 48 + energie * 12;

  return {
    grundton,
    toene: [
      `hsl(${grundton} ${saettigung}% ${helligkeit}%)`,
      `hsl(${(grundton + 42) % 360} ${saettigung}% ${helligkeit - 6}%)`,
      `hsl(${(grundton + 318) % 360} ${saettigung - 8}% ${helligkeit + 6}%)`,
      `hsl(${(grundton + 180) % 360} ${saettigung - 14}% ${helligkeit}%)`,
    ],
    hell: `hsl(${grundton} 90% 72%)`,
  };
}

// --- Die Visualisierung ---------------------------------------------------

class Visualisierung {
  constructor(leinwand) {
    this.leinwand = leinwand;
    this.stift = leinwand.getContext('2d');

    // Die Lava wird klein gerechnet und gross gezogen. Sie ist ohnehin
    // unscharf, und ein Viertel der Flaeche ist ein Viertel der Arbeit - das
    // ist der Unterschied zwischen fluessig und ruckelig auf einem iPad.
    this.lavaLeinwand = document.createElement('canvas');
    this.lavaStift = this.lavaLeinwand.getContext('2d');

    this.zeit = 0;
    this.letzterBeat = -1;
    this.ringe = [];
    this.funken = [];
    this.blasen = [];
    this.paletten = new Map();
    this.stossHalt = 0;
    this.letzterDrop = -1;

    // Ein Modus je Track. Vorher liefen alle Effekte gleichzeitig - das war
    // viel und trotzdem immer dasselbe. Einer nach dem anderen gibt jedem
    // Effekt Raum und dem Abend Abwechslung.
    this.modusFuerTrack = new Map();
    this.naechsterModus = 0;
    // null = automatisch. Sonst der Name eines Modus, von Hand gewaehlt.
    this.modusZwang = null;
    this.zuletztGewaehlt = null;
    // Von Hand ausgeloester Drop - fuer die Abnahme und zum Vorfuehren.
    this.dropVonHand = false;

    /*
     * Die Bildguete.
     *
     * Der Regler im Fraktal passt sich zwar von allein an die gemessene Zeit
     * an, aber er kann nur eine Sache: kleiner rechnen und wieder groesser.
     * Was er nicht kann, ist die Leinwand selbst kleiner machen - und genau
     * die ist auf einem Tablet der grosse Posten. Ein iPad meldet die
     * doppelte Punktdichte, also viermal so viele Punkte, und zwar fuer
     * *alle* Schichten: Lava, Fraktal, Ringe, Schrift.
     *
     * Deshalb hier eine Stufe von Hand. Sie senkt beides zugleich - die
     * Punktdichte der Leinwand und die Obergrenze, bis zu der das Fraktal
     * rechnen darf.
     */
    this.guetestufe = 'hoch';
    try {
      const gemerkt = window.localStorage?.getItem('dj-bildguete');
      if (gemerkt && GUETESTUFEN[gemerkt]) this.guetestufe = gemerkt;
    } catch {
      // Kein Speicher, kein Problem - dann eben jedes Mal von vorn.
    }
    // Geglaettete Bildzeit, damit man auf dem Geraet sieht, was die Stufe tut.
    this.bildMs = 16;

    // Drei Rauschquellen, damit sich die Bewegungen nicht synchronisieren.
    this.n1 = rauschen(7919);
    this.n2 = rauschen(104729);
    this.n3 = rauschen(1299709);

    this.masseSetzen();
  }

  masseSetzen() {
    const stufe = GUETESTUFEN[this.guetestufe] ?? GUETESTUFEN.hoch;
    const dichte = Math.min(window.devicePixelRatio || 1, stufe.dichte);
    this.breite = this.leinwand.clientWidth;
    this.hoehe = this.leinwand.clientHeight;
    this.leinwand.width = Math.max(1, Math.round(this.breite * dichte));
    this.leinwand.height = Math.max(1, Math.round(this.hoehe * dichte));
    this.stift.setTransform(dichte, 0, 0, dichte, 0, 0);

    this.lavaLeinwand.width = Math.max(1, Math.round(this.breite / stufe.lava));
    this.lavaLeinwand.height = Math.max(1, Math.round(this.hoehe / stufe.lava));
  }

  /** Die Bildguete umstellen. Wirkt sofort und wird gemerkt. */
  gueteSetzen(name) {
    if (!GUETESTUFEN[name]) return;
    this.guetestufe = name;
    try {
      window.localStorage?.setItem('dj-bildguete', name);
    } catch {
      // s.o.
    }
    this.masseSetzen();
    gueteZuruecksetzen();
  }

  static guetestufen() {
    return Object.entries(GUETESTUFEN).map(([schluessel, g]) => ({ schluessel, name: g.name }));
  }

  modusFuer(track) {
    if (this.modusZwang && MODI[this.modusZwang]) return this.modusZwang;

    const schluessel = track?.id ?? track?.titel ?? 'leer';
    if (!this.modusFuerTrack.has(schluessel)) {
      const gewaehlt = modusAusTrack(track, this.zuletztGewaehlt);
      this.modusFuerTrack.set(schluessel, gewaehlt);
      this.zuletztGewaehlt = gewaehlt;
      this.naechsterModus++;
    }
    return this.modusFuerTrack.get(schluessel);
  }

  /**
   * Einen Drop von Hand ausloesen.
   *
   * Am Abend braucht das niemand, aber ohne diesen Griff laesst sich die
   * Wirkung eines Drops nicht messen: Man muesste warten, bis im Track einer
   * kommt, und haette dann keinen definierten Zeitpunkt.
   */
  dropAusloesen() {
    this.dropVonHand = true;
  }

  /** Von Hand festlegen, oder mit null zurueck auf automatisch. */
  modusSetzen(name) {
    this.modusZwang = name && MODI[name] ? name : null;
  }

  /** Die Namen aller Modi - fuer die Auswahl auf der Buehne. */
  static modusnamen() {
    return Object.entries(MODI).map(([schluessel, m]) => ({ schluessel, name: m.name }));
  }

  paletteFuer(track) {
    if (!track) return palette('leer', 0.3);
    const schluessel = track.id ?? track.titel ?? 'leer';
    if (!this.paletten.has(schluessel)) {
      this.paletten.set(schluessel, palette(schluessel, track.energie ?? 0.5));
    }
    return this.paletten.get(schluessel);
  }

  /**
   * Ein Bild zeichnen.
   * @param {object} zustand   Momentaufnahme des Mixers
   * @param {Uint8Array} spektrum
   * @param {number} sekunden  Zeit seit dem letzten Bild
   * @param {Float32Array|null} welle  Zeitbereich, nur vom Modus "Wellen" genutzt
   */
  zeichne(zustand, spektrum, sekunden, welle = null) {
    this.zeit += sekunden;
    const { stift, breite, hoehe } = this;

    const aktiv = zustand.decks.find((d) => d.aktiv && d.laeuft) ?? zustand.decks[0];
    const zweit = zustand.decks.find((d) => d !== aktiv && d.laeuft);
    const uebergang = zustand.uebergang?.fortschritt > 0 ? zustand.uebergang : null;

    const takt = this.taktLage(aktiv);
    const spannung = this.spannungBis(aktiv, takt);
    const wucht = this.pegelWucht(spektrum);

    // Beim Drop: alles auf einmal. Das Signal geht auch an den Modus - das
    // Mandelbrot kehrt dabei seine Flugrichtung um, und damit hat der
    // staerkste Moment der Musik auch im Bild seinen staerksten Moment.
    const dropJetzt = Boolean(takt && this.dropErreicht(aktiv, takt)) || this.dropVonHand;
    this.dropVonHand = false;
    if (dropJetzt) this.ausbruch(spannung);
    if (takt) this.beatPruefen(takt, wucht);

    stift.clearRect(0, 0, breite, hoehe);

    // Die Lava bleibt immer im Hintergrund - sie ist die Stimmung im Raum,
    // kein Effekt. Davor laeuft genau ein Modus, und der wechselt je Track.
    this.lavaZeichnen(aktiv, zweit, uebergang, spannung, wucht);

    const modus = MODI[this.modusFuer(aktiv?.track)] ?? MODI.iris;
    const bildBegonnen = performance.now();
    this.letzterModusName = modus.name;
    modus.zeichne(stift, {
      breite,
      hoehe,
      zeit: this.zeit,
      sekunden,
      spektrum,
      welle: welle ?? new Float32Array(0),
      takt,
      spannung,
      wucht,
      drop: dropJetzt,
      guetestufe: this.guetestufe,
      palette: this.paletteFuer(aktiv?.track),
      paletteB: zweit ? this.paletteFuer(zweit.track) : null,
      anteilB: uebergang ? uebergang.fortschritt : 0,
    });

    // Ringe, Funken, Spannungsbogen und das Aufblitzen nach dem Drop gehoeren
    // zu den Modi, die von Bewegung im Bild leben. Ein Modus darf sie abwaehlen
    // - siehe die Begruendung beim Mandelbrot in visualmodi.js.
    if (modus.schmuck !== false) {
      this.ringeZeichnen(sekunden);
      this.funkenZeichnen(sekunden);
      this.spannungZeigen(spannung, aktiv);

      if (this.stossHalt > 0) {
        // Kurzes Aufblitzen nach dem Drop.
        stift.globalCompositeOperation = 'lighter';
        stift.fillStyle = `rgba(255,255,255,${this.stossHalt * 0.5})`;
        stift.fillRect(0, 0, breite, hoehe);
        stift.globalCompositeOperation = 'source-over';
      }
    } else {
      // Aufgeraeumt wird trotzdem, sonst stauen sich Ringe und Funken an und
      // stehen beim naechsten Moduswechsel alle auf einmal im Bild.
      this.ringe.length = 0;
      this.funken.length = 0;
    }
    if (this.stossHalt > 0) this.stossHalt = Math.max(0, this.stossHalt - sekunden * 3.5);

    // Wie lange ein Bild wirklich braucht. Traege geglaettet, damit die
    // Anzeige lesbar bleibt statt zu zappeln.
    const gebraucht = performance.now() - bildBegonnen;
    this.bildMs = this.bildMs * 0.9 + gebraucht * 0.1;
  }

  // --- Wo stehen wir im Takt? ---------------------------------------------

  taktLage(deck) {
    if (!deck?.laeuft || !deck.track?.bpm) return null;
    const beatLaenge = 60 / deck.track.bpm;
    const beat = (deck.stelle - (deck.track.raster ?? 0)) / beatLaenge;
    return {
      beat,
      // Nachkommastelle: 0 direkt auf dem Schlag, 1 kurz davor.
      imBeat: beat - Math.floor(beat),
      nummer: Math.floor(beat),
      aufEins: Math.floor(beat) % 4 === 0,
      aufPhrase: Math.floor(beat) % 32 === 0,
    };
  }

  // Wie nah ist der naechste Drop? 0 = weit weg, 1 = jetzt gleich.
  //
  // Das ist der Wert, der diese Visualisierung von einem Pegelzappler
  // unterscheidet. Sechzehn Takte vorher fangen wir an, uns zusammenzuziehen.
  spannungBis(deck, takt) {
    if (!takt || !deck?.track?.marken?.length) return 0;
    const drops = deck.track.marken.filter((m) => m.name === 'drop');
    const kommend = drops.find((m) => m.beat > takt.beat);
    if (!kommend) return 0;

    const abstand = kommend.beat - takt.beat;
    const anlauf = 64; // sechzehn Takte
    if (abstand > anlauf) return 0;
    const roh = 1 - abstand / anlauf;
    // Hinten steiler: die letzten Takte sollen sich deutlich anders anfuehlen.
    return roh * roh;
  }

  dropErreicht(deck, takt) {
    const drops = deck.track?.marken?.filter((m) => m.name === 'drop') ?? [];
    for (const drop of drops) {
      if (takt.beat >= drop.beat && takt.beat < drop.beat + 1 && this.letzterDrop !== drop.beat) {
        this.letzterDrop = drop.beat;
        return true;
      }
    }
    return false;
  }

  pegelWucht(spektrum) {
    if (!spektrum) return 0;
    // Nur das untere Achtel: Bass und Kick tragen die Wucht.
    let summe = 0;
    const bis = Math.floor(spektrum.length / 8);
    for (let i = 0; i < bis; i++) summe += spektrum[i];
    return Math.min(1, summe / bis / 200);
  }

  beatPruefen(takt, wucht) {
    if (takt.nummer === this.letzterBeat) return;
    this.letzterBeat = takt.nummer;

    const staerke = takt.aufPhrase ? 1 : takt.aufEins ? 0.6 : 0.28;
    this.ringe.push({
      radius: 0,
      staerke: staerke * (0.5 + wucht),
      tempo: 320 + staerke * 500,
      dicke: 1 + staerke * 4,
    });
    if (this.ringe.length > 24) this.ringe.shift();
  }

  ausbruch(spannung) {
    this.stossHalt = 0.5 + spannung * 0.5;
    // Zwei Schockwellen kurz hintereinander wirken wuchtiger als eine.
    this.ringe.push({ radius: 0, staerke: 2.2, tempo: 1500, dicke: 10 });
    this.ringe.push({ radius: 0, staerke: 1.4, tempo: 900, dicke: 5 });

    const mitte = { x: this.breite / 2, y: this.hoehe / 2 };
    for (let i = 0; i < 90; i++) {
      const winkel = Math.random() * TAU;
      const tempo = 200 + Math.random() * 900;
      this.funken.push({
        x: mitte.x,
        y: mitte.y,
        vx: Math.cos(winkel) * tempo,
        vy: Math.sin(winkel) * tempo,
        leben: 0.7 + Math.random() * 0.9,
        alter: 0,
      });
    }
  }

  // --- Schicht 1: Lava ----------------------------------------------------

  lavaZeichnen(aktiv, zweit, uebergang, spannung, wucht) {
    const { lavaStift: ls, lavaLeinwand: ll } = this;
    const b = ll.width;
    const h = ll.height;

    ls.globalCompositeOperation = 'source-over';
    ls.fillStyle = '#07070c';
    ls.fillRect(0, 0, b, h);
    ls.globalCompositeOperation = 'lighter';

    const paletteA = this.paletteFuer(aktiv?.track);
    const paletteB = zweit ? this.paletteFuer(zweit.track) : null;
    const anteilB = uebergang ? uebergang.fortschritt : 0;

    // Beim Aufbau ziehen sich die Blasen zur Mitte und werden kleiner - das
    // Bild wird enger, bevor es aufreisst.
    const zug = 1 - spannung * 0.55;
    const groesse = (0.42 - spannung * 0.14 + wucht * 0.07) * Math.min(b, h);

    const anzahl = 7;
    for (let i = 0; i < anzahl; i++) {
      const t = this.zeit * 0.09 + i * 13.7;
      // Drei Rauschquellen ergeben eine Bahn, die sich nie exakt wiederholt.
      const x = (0.5 + (this.n1(t) - 0.5) * 1.3 * zug) * b;
      const y = (0.5 + (this.n2(t + 40) - 0.5) * 1.3 * zug) * h;
      const r = groesse * (0.55 + this.n3(t + 80) * 0.75);

      // Waehrend eines Uebergangs mischen sich die Paletten beider Tracks -
      // man sieht, dass zwei Welten uebereinanderliegen, bevor man es hoert.
      const nimmB = paletteB && (i % 2 === 0 ? anteilB > 0.35 : anteilB > 0.65);
      const farbe = (nimmB ? paletteB : paletteA).toene[i % 4];

      const verlauf = ls.createRadialGradient(x, y, 0, x, y, r);
      verlauf.addColorStop(0, farbe);
      verlauf.addColorStop(0.45, farbe.replace(')', ' / 45%)').replace('hsl(', 'hsl('));
      verlauf.addColorStop(1, 'transparent');
      ls.globalAlpha = 0.5 + wucht * 0.35;
      ls.fillStyle = verlauf;
      ls.beginPath();
      ls.arc(x, y, r, 0, TAU);
      ls.fill();
    }
    ls.globalAlpha = 1;

    // Klein gerechnet, gross gezogen: Die Unschaerfe beim Hochskalieren ist
    // hier kein Makel, sondern genau der weiche Lampenlook.
    this.stift.imageSmoothingEnabled = true;
    this.stift.globalCompositeOperation = 'source-over';
    this.stift.drawImage(ll, 0, 0, this.breite, this.hoehe);
  }

  // --- Schicht 3: Puls ----------------------------------------------------

  ringeZeichnen(sekunden) {
    const { stift, breite, hoehe } = this;
    const mx = breite / 2;
    const my = hoehe / 2;
    const grenze = Math.hypot(breite, hoehe) * 0.6;

    stift.globalCompositeOperation = 'lighter';
    for (const ring of this.ringe) {
      ring.radius += ring.tempo * sekunden;
      const rest = 1 - ring.radius / grenze;
      if (rest <= 0) continue;
      stift.beginPath();
      stift.arc(mx, my, ring.radius, 0, TAU);
      stift.strokeStyle = `rgba(255,255,255,${rest * rest * ring.staerke * 0.35})`;
      stift.lineWidth = ring.dicke * rest;
      stift.stroke();
    }
    this.ringe = this.ringe.filter((r) => r.radius < grenze);
    stift.globalCompositeOperation = 'source-over';
  }

  // --- Schicht 4: Funken --------------------------------------------------

  funkenZeichnen(sekunden) {
    const { stift } = this;
    stift.globalCompositeOperation = 'lighter';
    for (const funke of this.funken) {
      funke.alter += sekunden;
      funke.x += funke.vx * sekunden;
      funke.y += funke.vy * sekunden;
      // Abbremsen, damit sie auslaufen statt davonzuschiessen.
      funke.vx *= 1 - 1.6 * sekunden;
      funke.vy *= 1 - 1.6 * sekunden;
      const rest = 1 - funke.alter / funke.leben;
      if (rest <= 0) continue;
      stift.fillStyle = `rgba(255,255,255,${rest * 0.85})`;
      stift.beginPath();
      stift.arc(funke.x, funke.y, 1.5 + rest * 2, 0, TAU);
      stift.fill();
    }
    this.funken = this.funken.filter((f) => f.alter < f.leben);
    stift.globalCompositeOperation = 'source-over';
  }

  // --- Der Countdown zum Drop ---------------------------------------------

  // Ein duenner Bogen, der sich schliesst. Nur wenn es wirklich gleich soweit
  // ist - sonst waere es Dauerdeko und wuerde nichts mehr bedeuten.
  spannungZeigen(spannung, aktiv) {
    if (spannung < 0.25) return;
    const { stift, breite, hoehe } = this;
    const mx = breite / 2;
    const my = hoehe / 2;
    const r = Math.min(breite, hoehe) * 0.36;
    const pal = this.paletteFuer(aktiv?.track);

    stift.globalCompositeOperation = 'lighter';
    stift.beginPath();
    stift.arc(mx, my, r, -Math.PI / 2, -Math.PI / 2 + TAU * spannung);
    stift.strokeStyle = pal.hell;
    stift.globalAlpha = (spannung - 0.25) * 1.1;
    stift.lineWidth = 2 + spannung * 6;
    stift.lineCap = 'round';
    stift.stroke();
    stift.globalAlpha = 1;
    stift.globalCompositeOperation = 'source-over';
  }
}


// ===== public/buehne/buehne.js =====
// Die Buehne: hier laeuft die Musik, hier sieht man beim Mischen zu, und hier
// dreht man waehrend der Entwicklung an allem, was sich einstellen laesst.
//
// Der Ablauf ist eine Schleife:
//   1. Server fragen, was als naechstes kommt
//   2. Den Track laden (oder erzeugen) und bereitlegen
//   3. Auf der naechsten Phrasengrenze ueberblenden
//   4. Dem Server melden, was jetzt laeuft
//
// Punkt 2 passiert mit Vorlauf, Punkt 3 haelt sich ans Raster.


const $ = (id) => document.getElementById(id);

// Wie viel Vorlauf: bei dieser Restzeit wird der naechste Track geladen …
const LADEN_AB_REST = 45;
// … und bei dieser der Uebergang eingeplant.
const UEBERBLENDEN_AB_REST = 25;

const welt = {
  ctx: null,
  mixer: null,
  leitung: null,
  demo: false,
  // Nur der laufende und der naechste Puffer bleiben liegen. Ueber sechs
  // Stunden ist das der Unterschied zwischen laeuft und stirbt: ein
  // dekodierter Sechsminueter belegt rund 60 MB.
  puffer: new Map(),
  bibliothek: [],
  naechster: null,
  naechsterGrund: null,
  laedt: false,
  wechselLaeuft: false,
  verlauf: [],
  angleichAn: true,
  stilleSeit: null,
  zielenergie: 0.5,
};

// Zustand offenlegen. Zwei Gruende: Die Abnahme prueft damit die Engine statt
// der Beschriftung, und wenn am Partyabend etwas klemmt, sieht man in der
// Browserkonsole sofort nach, was die Decks wirklich tun.
window.__dj = welt;

// --- Start ----------------------------------------------------------------

$('startDemo').addEventListener('click', () => starten(true));
$('startEcht').addEventListener('click', () => starten(false));

// Erst herausfinden, wo wir laufen: mit Server oder als reine Webseite.
welt.leitung = await leitungSuchen();

if (welt.leitung.art === 'allein') {
  // Ohne Bibliothek ist der Pruefstand die einzige Betriebsart - und genau
  // dafuer ist er gebaut.
  $('echtHinweis').textContent =
    'Noch keine Musik da. Im Adminbereich unter /admin/dj hochladen.';
  $('startEcht').disabled = true;
} else {
  const tracks = await welt.leitung.bibliothek();
  $('echtHinweis').textContent = tracks.length
    ? `${tracks.length} Tracks, vermessen und bereit.`
    : 'Noch leer – unter /admin/dj hochladen.';
  $('startEcht').disabled = tracks.length === 0;
}

async function starten(demo) {
  welt.demo = demo;
  $('startDemo').disabled = true;
  $('startEcht').disabled = true;

  try {
    welt.ctx = new (window.AudioContext ?? window.webkitAudioContext)({ sampleRate: 44100 });
    await welt.ctx.resume();
    welt.mixer = new Mixer(welt.ctx);

    if (demo) {
      $('startDemo').querySelector('span').textContent = 'Musik wird erzeugt …';
      // Kurz Luft lassen, damit der Text noch gezeichnet wird, bevor der
      // Hauptstrang mit dem Rechnen beschaeftigt ist.
      await new Promise((f) => setTimeout(f, 50));
      const erzeugt = demoBibliothek(welt.ctx);
      welt.bibliothek = erzeugt.map((e) => e.track);
      for (const eintrag of erzeugt) welt.puffer.set(eintrag.track.id, eintrag.puffer);
      // Auch die Gegenstelle soll sie kennen - dann funktionieren Auswahl,
      // Wuensche und Abstimmung genauso wie spaeter mit echter Musik.
      await welt.leitung.bibliothekSetzen(welt.bibliothek);
      $('pruefstandMarke').textContent =
        welt.leitung.art === 'allein' ? 'Prüfstand · ohne Server' : 'Prüfstand';
      $('pruefstandMarke').hidden = false;
    } else {
      welt.bibliothek = await welt.leitung.bibliothek();
    }

    $('startschirm').hidden = true;
    $('konsole').hidden = false;
    bild = new Visualisierung($('visual'));
    // Auch das Bild offenlegen: Am Abend laesst sich damit in der Konsole der
    // Modus umstellen, wenn einer gerade nicht zum Raum passt.
    welt.bild = bild;

    const erster = await naechstenErfragen();
    const puffer = await pufferFuer(erster);
    welt.mixer.ersterTrack(erster, puffer);
    await laufendMelden(erster);
    aufraeumen(erster.id);

    await naechstenVorbereiten();
    schleife();
  } catch (fehler) {
    $('startFehler').hidden = false;
    $('startFehler').textContent = `Start fehlgeschlagen: ${fehler.message}`;
    $('startDemo').disabled = false;
    $('startEcht').disabled = false;
    throw fehler;
  }
}

// --- Nachschub ------------------------------------------------------------

async function naechstenErfragen() {
  const bpm = welt.mixer?.laufendesDeck?.effektivBpm() ?? null;
  const { track, grund, ziel } = await welt.leitung.naechster(bpm);
  welt.naechsterGrund = { grund, ziel };
  return track;
}

async function pufferFuer(track) {
  if (welt.puffer.has(track.id)) return welt.puffer.get(track.id);

  // `quelle` ist eine fertige Adresse (Supabase), `datei` ein Name im
  // Musikordner des lokalen Servers. Die Buehne muss nicht wissen, welches
  // von beiden gerade der Fall ist.
  const adresse = track.quelle ?? `/musik/${encodeURIComponent(track.datei)}`;
  const antwort = await fetch(adresse);
  if (!antwort.ok) throw new Error(`${track.titel} liess sich nicht laden (${antwort.status})`);
  const roh = await antwort.arrayBuffer();
  const puffer = await welt.ctx.decodeAudioData(roh);
  welt.puffer.set(track.id, puffer);
  return puffer;
}

// Alles freigeben ausser dem, was jetzt laeuft und was gleich kommt. Im
// Pruefstand bleiben die erzeugten Puffer liegen - die sind der Bestand.
function aufraeumen(...behalten) {
  if (welt.demo) return;
  for (const id of welt.puffer.keys()) {
    if (!behalten.includes(id)) welt.puffer.delete(id);
  }
}

async function naechstenVorbereiten() {
  if (welt.laedt || welt.naechster) return;
  welt.laedt = true;
  try {
    const track = await naechstenErfragen();
    await pufferFuer(track);
    welt.naechster = track;
  } catch (fehler) {
    console.error('Nachschub fehlgeschlagen', fehler);
  } finally {
    welt.laedt = false;
  }
}

async function laufendMelden(track) {
  await welt.leitung.laeuftMelden(track, welt.naechster);
}

// --- Uebergang ------------------------------------------------------------

async function ueberblenden(artWunsch = null) {
  if (welt.wechselLaeuft) return;
  if (!welt.naechster) {
    await naechstenVorbereiten();
    if (!welt.naechster) return;
  }
  welt.wechselLaeuft = true;

  const track = welt.naechster;
  welt.naechster = null;

  try {
    const puffer = welt.puffer.get(track.id) ?? (await pufferFuer(track));
    const angepasst = welt.angleichAn ? track : { ...track, angleichDb: 0 };
    const plan = welt.mixer.uebergang(angepasst, puffer, artWunsch || null, welt.zielenergie);

    verlaufEintragen(plan);
    await laufendMelden(track);
    aufraeumen(track.id);

    // Nach dem Uebergang gleich den uebernaechsten vorbereiten.
    setTimeout(() => {
      welt.wechselLaeuft = false;
      naechstenVorbereiten();
    }, Math.max(500, (plan.endeZeit - welt.ctx.currentTime) * 1000));
  } catch (fehler) {
    console.error('Uebergang fehlgeschlagen', fehler);
    welt.wechselLaeuft = false;
  }
}

function verlaufEintragen(plan) {
  welt.verlauf.unshift({
    zeit: new Date(),
    art: plan.name,
    von: plan.vonTrack?.titel ?? '–',
    nach: plan.nachTrack?.titel ?? '–',
    hinweis: plan.grund
      ? plan.grund
      : plan.tempo?.art && plan.tempo.art !== 'direkt'
        ? `${plan.tempo.art}es Tempo`
        : `${Math.round((plan.tempo?.zug ?? 0) * 1000) / 10} % Zug`,
  });
  welt.verlauf = welt.verlauf.slice(0, 30);
  zeichneVerlauf();
}

// --- Wiedergabe anhalten und weiterlaufen lassen ---------------------------
//
// iOS friert den Tonkontext ein, sobald man die App wechselt oder das Display
// sperrt, und gibt ihn nur nach einer Beruehrung wieder frei. Ohne das hier
// stuende die Buehne danach stumm da und saehe kaputt aus.

async function tonWeiter() {
  if (!welt.ctx) return;
  try {
    await welt.ctx.resume();
  } catch {
    // Beim naechsten Antippen nochmal.
  }
  tonZustandZeigen();
}

function tonZustandZeigen() {
  const laeuft = welt.ctx?.state === 'running';
  $('weiter').hidden = laeuft || !welt.ctx;
  $('wiedergabe').textContent = laeuft ? '⏸' : '▶';
}

$('weiter').addEventListener('click', tonWeiter);

$('wiedergabe').addEventListener('click', async () => {
  if (!welt.ctx) return;
  if (welt.ctx.state === 'running') await welt.ctx.suspend();
  else await welt.ctx.resume();
  tonZustandZeigen();
});

// Beim Zurueckkommen aus dem Hintergrund gleich nachsehen.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) tonZustandZeigen();
});

// --- Bedienung ------------------------------------------------------------

$('jetztUeberblenden').addEventListener('click', () => ueberblenden($('artWahl').value));


// Die Auswahl fuellt sich aus den Modi selbst - so taucht ein neuer Modus
// hier von allein auf, statt an zwei Stellen gepflegt werden zu muessen.
for (const { schluessel, name } of Visualisierung.modusnamen()) {
  const eintrag = document.createElement('option');
  eintrag.value = schluessel;
  eintrag.textContent = `Bild: ${name}`;
  $('modusWahl').append(eintrag);
}

$('modusWahl').addEventListener('change', (e) => {
  bild?.modusSetzen(e.target.value || null);
});

/*
 * Die Bildguete von Hand.
 *
 * Der Regler im Fraktal passt sich zwar an die gemessene Zeit an, aber er
 * kann die Leinwand nicht kleiner machen - und die ist auf einem Tablet mit
 * doppelter Punktdichte der grosse Posten. Drei Stufen zum Durchprobieren,
 * daneben die gemessene Bildzeit, damit man sieht, was die Wahl bringt,
 * statt es zu erraten.
 */
for (const { schluessel, name } of Visualisierung.guetestufen()) {
  const eintrag = document.createElement('option');
  eintrag.value = schluessel;
  eintrag.textContent = `Qualität: ${name}`;
  $('gueteWahl').append(eintrag);
}

$('gueteWahl').addEventListener('change', (e) => {
  bild?.gueteSetzen(e.target.value);
});

// Die Anzeige zweimal je Sekunde nachziehen. Oefter waere unlesbar.
setInterval(() => {
  if (!bild) return;
  $('gueteWahl').value = bild.guetestufe;
  const ms = bild.bildMs;
  const bilder = ms > 0.01 ? Math.min(60, Math.round(1000 / ms)) : 60;
  $('bildTempo').textContent = `${ms.toFixed(1)} ms · ${bilder}/s`;
}, 500);

$('angleichAn').addEventListener('change', (e) => {
  welt.angleichAn = e.target.checked;
});

$('energieRegler').addEventListener('input', async (e) => {
  await welt.leitung.handEnergie(Number(e.target.value) / 100);
});

// Tastenkuerzel - beim Entwickeln schneller als Klicken.
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === ' ') {
    e.preventDefault();
    ueberblenden($('artWahl').value);
  }
  const arten = { 1: 'blende', 2: 'aufzug', 3: 'echo', 4: 'schnitt' };
  if (arten[e.key]) ueberblenden(arten[e.key]);
});

// --- Zustand vom Server ---------------------------------------------------

welt.leitung.beiZustand((zustand) => {
  $('anlass').textContent = zustand.anlass ?? 'resident-dj';
  welt.zielenergie = zustand.zielenergie ?? 0.5;
  const prozent = Math.round(welt.zielenergie * 100);
  $('energieWert').textContent = `${prozent} %`;
  if (document.activeElement !== $('energieRegler')) {
    $('energieRegler').value = prozent;
  }
  $('energieQuelle').textContent = zustand.handbetrieb
    ? 'von Hand gesetzt'
    : `nach Uhrzeit${zustand.richtungen?.haerter || zustand.richtungen?.chilliger ? ` · Gäste: ${zustand.richtungen.chilliger} chilliger, ${zustand.richtungen.haerter} härter` : ''}`;

  // Der naechste Track wird lange im Voraus geholt. Verschiebt sich die
  // Zielenergie danach deutlich - weil jemand am Regler dreht oder die Gaeste
  // abstimmen - waere er von gestern. Dann lieber neu aussuchen, solange der
  // Uebergang noch nicht laeuft.
  const ziel = zustand.zielenergie ?? 0.5;
  if (
    welt.naechster &&
    !welt.wechselLaeuft &&
    welt.naechsterGrund?.ziel !== undefined &&
    Math.abs(ziel - welt.naechsterGrund.ziel) > 0.1
  ) {
    welt.naechster = null;
    naechstenVorbereiten();
  }
});

// --- Zeichnen -------------------------------------------------------------

let bild = null;
let spektrumDaten = null;
let wellenDaten = null;
let letzteZeit = 0;

function leinwandAnpassen() {
  bild?.masseSetzen();
}
window.addEventListener('resize', leinwandAnpassen);

function schleife(jetzt = 0) {
  requestAnimationFrame(schleife);
  if (!welt.mixer) return;

  // Zeit zwischen zwei Bildern, gedeckelt: Nach einem Tabwechsel kaeme sonst
  // ein Riesensprung, und alle Bewegungen wuerden auf einmal durchrauschen.
  const sekunden = Math.min(0.05, (jetzt - letzteZeit) / 1000 || 0.016);
  letzteZeit = jetzt;

  const zustand = welt.mixer.zustand();

  if (!spektrumDaten) spektrumDaten = new Uint8Array(welt.mixer.messung.frequencyBinCount);
  // Die Wellenform ist doppelt so lang wie das Spektrum: fftSize Abtastwerte
  // im Zeitbereich gegen fftSize/2 Frequenzbaender. Der Modus "Wellen"
  // zeichnet sie unmittelbar, alle anderen ruehren sie nicht an.
  if (!wellenDaten) wellenDaten = new Float32Array(welt.mixer.messung.fftSize);
  welt.mixer.spektrum(spektrumDaten);
  welt.mixer.wellenform(wellenDaten);
  bild?.zeichne(zustand, spektrumDaten, sekunden, wellenDaten);

  zeichneDecks(zustand);
  zeichneUebergang(zustand);

  $('pegelBalken').style.width = `${Math.min(100, zustand.pegel * 260)}%`;
  $('uhr').textContent = new Date().toLocaleTimeString('de-DE', {
    hour: '2-digit',
    minute: '2-digit',
  });

  const g = welt.naechsterGrund;
  $('naechsterGrund').textContent = welt.naechster
    ? `${g?.grund === 'wunsch' ? 'Gästewunsch' : 'Autopilot'} · Energie ${Math.round((welt.naechster.energie ?? 0) * 100)} %`
    : '';

  tonZustandZeigen();
  nachschubPruefen();
  wachhund(zustand);
}

// --- Remix ----------------------------------------------------------------
//
// Vor jedem Drop wird geprueft, ob ein Loop-Roll hineinpasst und ob die Regie
// ihn gerade will. Die Regie haengt an der Zielenergie: frueh am Abend gar
// nicht, spaeter oft und schaerfer.

function nachschubPruefen() {
  const rest = welt.mixer.restSekunden();
  if (rest < LADEN_AB_REST) naechstenVorbereiten();
  if (rest < UEBERBLENDEN_AB_REST && !welt.wechselLaeuft && welt.naechster) {
    ueberblenden();
  }
}

// Stille ist der einzige Fehler, den dieses System nicht machen darf. Bleibt
// der Ausgang stumm, obwohl ein Deck laeuft, wird hart weitergeschaltet.
//
// Die Schwelle liegt bewusst sehr tief. Ein leises Intro oder ein Breakdown
// kann auf ein Tausendstel heruntergehen - wer da schon anschlaegt, zerschiesst
// genau die Stellen, die ein DJ absichtlich leise macht. Es geht nur um den
// Fall "wirklich nichts".
const STILL = 0.00005;
const STILLE_ERLAUBT_MS = 2500;

function wachhund(zustand) {
  // Angehalten ist keine Stoerung, sondern Absicht.
  if (welt.ctx?.state !== 'running') {
    welt.stilleSeit = null;
    return;
  }
  const einDeckLaeuft = zustand.decks.some((d) => d.laeuft);
  if (!einDeckLaeuft || zustand.pegel >= STILL) {
    welt.stilleSeit = null;
    return;
  }
  // Direkt nach einem Start braucht die Messung einen Moment.
  if (welt.wechselLaeuft) {
    welt.stilleSeit = null;
    return;
  }
  if (welt.stilleSeit === null) {
    welt.stilleSeit = performance.now();
    return;
  }
  if (performance.now() - welt.stilleSeit > STILLE_ERLAUBT_MS) {
    console.warn('Wachhund: Stille erkannt, schalte hart weiter');
    welt.stilleSeit = null;
    welt.wechselLaeuft = false;
    ueberblenden('schnitt');
  }
}

// Links steht immer, was laeuft, rechts was kommt - unabhaengig davon,
// welches Deck der Mixer gerade benutzt. Fuer den, der davorsteht, ist "Deck
// B" bedeutungslos; "als naechstes" nicht.
function zeichneDecks(zustand) {
  const u = zustand.uebergang;
  let laufend;
  let anderes;

  if (u && u.fortschritt > 0) {
    // Waehrend einer Blende richtet sich die Anzeige nach dem Uebergang, nicht
    // nach der Deck-Zaehlung des Mixers: Der schaltet intern schon um, wenn
    // der Neue erst anfaengt hochzukommen. Zu hoeren ist da noch der Alte -
    // und links soll stehen, was man hoert.
    laufend = zustand.decks.find((d) => d.track?.id === u.vonTrack?.id && d.laeuft);
    anderes = zustand.decks.find((d) => d.track?.id === u.nachTrack?.id && d.laeuft);
  }

  laufend ??= zustand.decks.find((d) => d.aktiv && d.laeuft) ?? zustand.decks[0];
  anderes ??= zustand.decks.find((d) => d !== laufend && d.laeuft);

  fuelleSeite($('deckA'), laufend, true);

  if (anderes) {
    // Waehrend eines Uebergangs laeuft der Neue schon - dann zeigt die rechte
    // Seite ihn mitsamt seinen Reglern.
    fuelleSeite($('deckB'), anderes, true);
  } else if (welt.naechster) {
    // Sonst der vorbereitete Track, noch ohne Laufwerte.
    fuelleSeite($('deckB'), { track: welt.naechster, bpm: welt.naechster.bpm, tempo: 1,
                              stelle: 0, dauer: 0, blende: 0, tief: 0 }, false);
  } else {
    fuelleSeite($('deckB'), null, false);
  }
}

function fuelleSeite(knoten, daten, hervorheben) {
  knoten.classList.toggle('aktiv', !!daten && hervorheben);

  if (!daten?.track) {
    knoten.querySelector('.deck-titel').textContent = '–';
    knoten.querySelector('.deck-interpret').textContent = '';
    knoten.querySelector('.deck-bpm').textContent = '';
    knoten.querySelector('.fortschritt > i').style.width = '0%';
    return;
  }

  knoten.querySelector('.deck-titel').textContent = daten.track.titel ?? '–';
  knoten.querySelector('.deck-interpret').textContent = daten.track.interpret ?? '';
  knoten.querySelector('.deck-bpm').textContent = daten.bpm
    ? `${daten.bpm.toFixed(1)} BPM${Math.abs(daten.tempo - 1) > 0.001 ? ` · ${((daten.tempo - 1) * 100).toFixed(1)} %` : ''}`
    : '';

  const anteil = daten.dauer ? Math.min(1, daten.stelle / daten.dauer) : 0;
  knoten.querySelector('.fortschritt > i').style.width = `${anteil * 100}%`;
  zeichneMarken(knoten.querySelector('.fortschritt > u'), daten);

  knoten.querySelector('[data-regler="blende"]').style.width = `${daten.blende * 100}%`;
  // Bass: 0 dB = voll, -32 dB = weg.
  knoten.querySelector('[data-regler="tief"]').style.width =
    `${Math.max(0, 1 + daten.tief / 32) * 100}%`;
}

// Die Strukturmarken als feine Striche im Fortschrittsbalken - so sieht man,
// ob der Uebergang wirklich am Outro sitzt.
function zeichneMarken(knoten, daten) {
  const marken = daten.track?.marken;
  if (!marken || !daten.dauer) return (knoten.style.backgroundImage = '');
  const striche = marken
    .filter((m) => m.name !== 'intro')
    .map((m) => {
      const p = ((m.sekunde / daten.dauer) * 100).toFixed(2);
      const farbe = m.name === 'drop' ? 'rgba(255,61,127,.9)' : 'rgba(255,255,255,.28)';
      return `linear-gradient(90deg, transparent ${p}%, ${farbe} ${p}%, ${farbe} calc(${p}% + 1px), transparent calc(${p}% + 1px))`;
    });
  knoten.style.backgroundImage = striche.join(',');
}

function zeichneUebergang(zustand) {
  const u = zustand.uebergang;
  $('uebergang').hidden = !u;
  $('wartend').hidden = !!u;
  if (!u) return;

  const wartet = u.startetIn > 0.05;
  $('uebergangName').textContent = wartet
    ? `${u.name} in ${u.startetIn.toFixed(1)} s`
    : u.name;
  $('uebergangFortschritt').style.width = `${u.fortschritt * 100}%`;
  $('uebergangGrund').textContent = wartet
    ? 'wartet auf die nächste Phrasengrenze'
    : (u.grund ?? u.beschreibung);
}

function zeichneVerlauf() {
  $('verlauf').innerHTML = '';
  for (const eintrag of welt.verlauf) {
    const zeile = document.createElement('li');
    const zeit = eintrag.zeit.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    zeile.innerHTML = '<span></span><em></em><b></b><span></span>';
    const felder = zeile.children;
    felder[0].textContent = zeit;
    felder[1].textContent = eintrag.art;
    felder[2].textContent = eintrag.nach;
    felder[3].textContent = eintrag.hinweis;
    $('verlauf').append(zeile);
  }
}

// --- Steuerung zeigen und verstecken --------------------------------------
//
// Auf einem Monitor im Raum soll nichts herumstehen, was niemand bedient.
// Jede Maus- oder Fingerbewegung holt die Leiste zurueck, danach verschwindet
// sie wieder.
let ruheZaehler = null;
function steuerungZeigen() {
  $('steuerung').classList.add('sichtbar');
  clearTimeout(ruheZaehler);
  ruheZaehler = setTimeout(() => {
    // Nicht wegblenden, solange jemand tatsaechlich an einem Regler haengt.
    if ($('steuerung').contains(document.activeElement)) return steuerungZeigen();
    $('steuerung').classList.remove('sichtbar');
  }, 3500);
}
for (const ereignis of ['mousemove', 'touchstart', 'keydown']) {
  window.addEventListener(ereignis, steuerungZeigen, { passive: true });
}

// Die Uebergangsarten aus der Engine in die Auswahlliste, damit beides nicht
// auseinanderlaeuft.
for (const [schluessel, plan] of Object.entries(UEBERGAENGE)) {
  const option = [...$('artWahl').options].find((o) => o.value === schluessel);
  if (option) option.title = plan.beschreibung;
}

</script>
  </body>
</html>
