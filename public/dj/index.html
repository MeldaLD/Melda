    <title>resident-dj · Buehne</title>
    <style>
:root {
  color-scheme: dark;
  --grund: #07070c;
  --text: #f2f2f8;
  --leise: #9a9ab4;
  --akzent: #ff3d7f;
  --gut: #3ddc97;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--grund);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
  overflow: hidden;
}

/* --- Startschirm -------------------------------------------------------- */

.start {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 2rem;
  background: radial-gradient(ellipse at 50% 0%, #1a0a18 0%, var(--grund) 60%);
  z-index: 10;
}

.start[hidden] {
  display: none;
}

.start-inhalt {
  width: min(46rem, 100%);
  text-align: center;
}

.start h1 {
  margin: 0;
  font-size: clamp(2.5rem, 7vw, 4.5rem);
  letter-spacing: -0.04em;
}

.unterzeile {
  margin: 0.5rem 0 2.5rem;
  color: var(--leise);
  font-size: clamp(1rem, 1.6vw, 1.15rem);
}

.start-wahl {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
  gap: 1rem;
}

button.gross {
  display: block;
  padding: 1.4rem 1.5rem;
  border: 1px solid #24243a;
  border-radius: 1rem;
  background: #12121b;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.15s;
}

button.gross:hover:not(:disabled) {
  border-color: var(--akzent);
}

button.gross:disabled {
  opacity: 0.45;
  cursor: default;
}

button.gross strong {
  display: block;
  font-size: 1.1rem;
  margin-bottom: 0.3rem;
}

button.gross span {
  color: var(--leise);
  font-size: 0.9rem;
}

.fussnote {
  color: var(--leise);
  font-size: 0.85rem;
}

.fussnote[hidden] {
  display: none;
}

/* --- Die Visualisierung fuellt das Fenster und liegt hinter allem -------- */

#visual {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
}

/* --- Aufteilung --------------------------------------------------------- */
/*
  Die Mitte bleibt bewusst frei. Alles Geschriebene sitzt am Rand, ohne Kasten
  darunter - ein halbdurchsichtiger Kasten ueber einer bewegten Flaeche sieht
  immer schmutzig aus. Lesbarkeit macht hier der Schattenwurf.
*/

main {
  position: relative;
  z-index: 1;
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 1.5rem 2rem;
  pointer-events: none;
}

main[hidden] {
  display: none;
}

main :is(button, select, input, label) {
  pointer-events: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
}

.kopf-links,
.kopf-rechts {
  display: flex;
  align-items: center;
  gap: 0.9rem;
}

.marke,
#uhr {
  text-transform: uppercase;
  letter-spacing: 0.2em;
  font-size: 0.78rem;
  color: rgba(255, 255, 255, 0.75);
}

.pruefstand {
  padding: 0.15rem 0.55rem;
  border-radius: 999px;
  background: rgba(255, 193, 120, 0.16);
  color: #ffc178;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.pruefstand[hidden] {
  display: none;
}

.pegel {
  display: block;
  width: 5rem;
  height: 3px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.14);
  overflow: hidden;
}

.pegel > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--gut);
}

/* --- Fuss: was laeuft, was kommt ---------------------------------------- */

.fuss {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 2rem;
  align-items: end;
  text-shadow: 0 2px 16px rgba(0, 0, 0, 0.95);
}

.jetzt {
  min-width: 0;
  opacity: 0.35;
  transition: opacity 0.5s;
}

.jetzt.aktiv {
  opacity: 1;
}

.jetzt.rechts {
  text-align: right;
}

.etikett {
  display: block;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: rgba(255, 255, 255, 0.6);
}

.deck-titel {
  margin: 0.3rem 0 0.1rem;
  font-size: clamp(1.4rem, 3.2vw, 2.6rem);
  font-weight: 650;
  line-height: 1.05;
  letter-spacing: -0.025em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.zeile {
  margin: 0;
  display: flex;
  gap: 0.8rem;
  color: rgba(255, 255, 255, 0.72);
  font-size: 0.9rem;
}

.rechts .zeile {
  justify-content: flex-end;
}

.fortschritt {
  position: relative;
  height: 3px;
  margin: 0.7rem 0 0.4rem;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.15);
  overflow: hidden;
}

.fortschritt > i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: #fff;
}

/* Die Marken aus der Analyse: Breakdown und Drop. */
.fortschritt > u {
  position: absolute;
  inset: 0;
  background-repeat: no-repeat;
}

.regler {
  display: flex;
  gap: 0.4rem;
}

.reglerbalken {
  flex: 1;
  height: 2px;
  border-radius: 1px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
}

.reglerbalken > i {
  display: block;
  height: 100%;
  width: 0;
  background: rgba(255, 255, 255, 0.85);
}

.reglerbalken.bass > i {
  background: var(--akzent);
}

/* --- Uebergang in der Mitte --------------------------------------------- */

.mitte {
  min-width: 12rem;
  text-align: center;
  padding-bottom: 0.6rem;
}

.uebergang[hidden] {
  display: none;
}

.uebergang-name {
  display: block;
  font-size: 0.95rem;
  font-weight: 600;
  color: #fff;
}

.uebergang-balken {
  height: 3px;
  margin: 0.5rem 0;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.16);
  overflow: hidden;
}

.uebergang-balken > i {
  display: block;
  height: 100%;
  width: 0;
  background: #fff;
}

.uebergang-grund {
  font-size: 0.75rem;
  color: rgba(255, 255, 255, 0.65);
}

/* --- Steuerung: blendet sich aus ---------------------------------------- */
/*
  Am Partyabend fasst die niemand an, und sie soll das Bild nicht zerschneiden.
  Beim Entwickeln ist sie mit einer Handbewegung wieder da.
*/

.steuerung {
  position: fixed;
  left: 50%;
  bottom: 1.2rem;
  transform: translateX(-50%);
  z-index: 3;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem;
  max-width: min(60rem, 94vw);
  padding: 0.6rem 0.9rem;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 0.9rem;
  background: rgba(8, 8, 14, 0.82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s;
}

.steuerung.sichtbar {
  opacity: 1;
  pointer-events: auto;
}

.steuerung button,
.steuerung select {
  padding: 0.4rem 0.75rem;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 0.5rem;
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  font: inherit;
  font-size: 0.85rem;
  cursor: pointer;
}

.steuerung button:hover {
  border-color: var(--akzent);
}

.schieber {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.85rem;
  color: var(--leise);
}

.schieber input[type='range'] {
  width: 9rem;
  accent-color: var(--akzent);
}

.schalter {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.85rem;
  color: var(--leise);
  cursor: pointer;
}

.naechster-grund,
.naechster {
  font-size: 0.8rem;
  color: var(--leise);
}

.verlauf {
  flex-basis: 100%;
  margin: 0;
  padding: 0.4rem 0 0;
  list-style: none;
  max-height: 5rem;
  overflow-y: auto;
  font-size: 0.78rem;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.verlauf li {
  display: flex;
  gap: 0.6rem;
  padding: 0.15rem 0;
  color: var(--leise);
}

.verlauf li b {
  color: var(--text);
  font-weight: 500;
}

.verlauf li em {
  font-style: normal;
  color: var(--akzent);
  flex: none;
}

@media (max-width: 60rem) {
  .fuss {
    grid-template-columns: 1fr;
    gap: 0.8rem;
  }

  .jetzt.rechts {
    text-align: left;
  }

  .rechts .zeile {
    justify-content: flex-start;
  }
}

/* --- Wiedergabe --------------------------------------------------------- */

.play {
  color: var(--akzent);
  font-size: 0.85em;
}

/*
  iOS friert den Ton ein, wenn man die App wechselt. Dieser Schirm holt ihn
  mit einer Beruehrung zurueck - ohne ihn stuende die Buehne stumm da und
  saehe kaputt aus.
*/
.weiter {
  position: fixed;
  inset: 0;
  z-index: 8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.2rem;
  border: 0;
  background: rgba(7, 7, 12, 0.86);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--text);
  font: inherit;
  font-size: 1.1rem;
  cursor: pointer;
}

.weiter[hidden] {
  display: none;
}

.gross-play {
  display: grid;
  place-items: center;
  width: 5.5rem;
  height: 5.5rem;
  padding-left: 0.4rem;
  border: 2px solid var(--akzent);
  border-radius: 50%;
  font-size: 2.2rem;
}

#wiedergabe {
  min-width: 2.4rem;
}

/* Wie der DJ gerade spielt - Aufwaermen, Fahrt, Druck, Vollgas. */
.stil {
  padding: 0.15rem 0.6rem;
  border-radius: 999px;
  background: rgba(255, 61, 127, 0.16);
  color: var(--akzent);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

  <body>

    <canvas id="visual" aria-hidden="true"></canvas>

        </p>

            >

      </div>
    </div>

    <!--

    -->
    <button class="weiter" id="weiter" hidden>

    <main id="konsole" hidden>

      <!--

      <div class="steuerung" id="steuerung">

        <button id="wiedergabe" title="Anhalten und weiterlaufen lassen">▶</button>
        <button id="jetztUeberblenden">Jetzt überblenden</button>
        <select id="artWahl" title="Übergangsart erzwingen">

          Angleich

    <script type="module">
// ===== public/gemeinsam/takt.js =====
// Die Rechnerei hinter jedem Uebergang: Wo ist die naechste Phrasengrenze, wann
// faellt Beat Nummer n, und wie weit darf ich am Tempo drehen?
//
// Bewusst reine Funktionen ohne Web Audio - so laesst sich das in Node
// nachrechnen (siehe pruefungen/takt.mjs). Timing ist die Fehlerquelle Nummer
// eins beim Mischen, und ein Fehler hier hoert sich nicht nach Fehler an,
// sondern nur nach "irgendwie schlecht".

// Elektronische Musik ist in Achtergruppen gebaut. Ein Uebergang auf dem
// richtigen Beat, aber mitten in der Phrase, klingt falsch - auch wenn das
// Tempo exakt stimmt. Das ist der groesste Hebel fuer Qualitaet ueberhaupt.
const BEATS_PRO_TAKT = 4;
const TAKTE_PRO_PHRASE = 8;
const BEATS_PRO_PHRASE = BEATS_PRO_TAKT * TAKTE_PRO_PHRASE; // 32

// Sekunden pro Beat.
function beatDauer(bpm) {
  return 60 / bpm;
}

// Wann faellt Beat n, in Sekunden ab Dateianfang?
// `raster` ist der Versatz des ersten Downbeats - fast nie exakt null, weil
// Dateien mit etwas Stille oder einem Anspieler beginnen.
function beatZeit(track, beatNr) {
  return track.raster + beatNr * beatDauer(track.bpm);
}

// Umgekehrt: Auf welchem Beat stehen wir zum Zeitpunkt `sekunden`?
// Nicht gerundet - die Nachkommastelle ist die Position innerhalb des Beats.
function beatBei(track, sekunden) {
  return (sekunden - track.raster) / beatDauer(track.bpm);
}

// Die naechste Phrasengrenze ab `sekunden`, als Beatnummer.
// `mindestensBeats` haelt Abstand, damit noch Zeit zum Vorbereiten bleibt -
// eine Grenze, die in 50 Millisekunden faellt, nuetzt niemandem.
function naechstePhrase(track, sekunden, mindestensBeats = 2) {
  const jetzt = beatBei(track, sekunden) + mindestensBeats;
  const phrase = Math.ceil(jetzt / BEATS_PRO_PHRASE) * BEATS_PRO_PHRASE;
  // Bei negativem Raster kann die erste Grenze vor dem Dateianfang liegen.
  return Math.max(0, phrase);
}

// Und die naechste Taktgrenze - fuer Notfaelle, bei denen 32 Beats zu lange
// dauern und ein Schnitt auf die Eins reicht.
function naechsterTakt(track, sekunden, mindestensBeats = 1) {
  const jetzt = beatBei(track, sekunden) + mindestensBeats;
  return Math.max(0, Math.ceil(jetzt / BEATS_PRO_TAKT) * BEATS_PRO_TAKT);
}

// Mit welcher Abspielgeschwindigkeit muss der *neue* Track laufen, damit er auf
// den laufenden passt? Rueckgabe 1 heisst: nicht angleichen, sondern schneiden.
//
// Ueber etwa sechs Prozent Zug klingt es nach Chipmunk, und das hoert jeder.
// Wir dehnen die Zeit nicht (kein Time-Stretch) - genau wie ein Plattenspieler
// verschiebt sich die Tonhoehe mit. Deshalb die enge Grenze.
function tempoVerhaeltnis(laufendBpm, neuBpm, toleranz = 0.06) {
  if (!laufendBpm || !neuBpm) {
    return { verhaeltnis: 1, passt: false, grund: 'kein Tempo bekannt' };
  }

  const kandidaten = [
    // Der Normalfall: der Neue laeuft auf demselben Tempo.
    { verhaeltnis: laufendBpm / neuBpm, art: 'direkt' },
    // Halbes und doppeltes Tempo passen musikalisch trotzdem: ein 64er-Track
    // laeuft zu 128er-Beats, nur mit halb so vielen Schlaegen. Damit werden
    // Paarungen moeglich, die sonst als "zu weit" durchgefallen waeren.
    { verhaeltnis: laufendBpm / 2 / neuBpm, art: 'halb' },
    { verhaeltnis: (laufendBpm * 2) / neuBpm, art: 'doppelt' },
  ];

  let bester = null;
  for (const kandidat of kandidaten) {
    const zug = Math.abs(kandidat.verhaeltnis - 1);
    // Kleine Zugabe gegen Fliesskommastaub: 1.06 - 1 ergibt in Gleitkomma
    // knapp mehr als 0.06 und wuerde sonst genau an der Grenze durchfallen.
    if (zug <= toleranz + 1e-9 && (!bester || zug < bester.zug)) {
      bester = { ...kandidat, zug };
    }
  }

  if (!bester) {
    return {
      verhaeltnis: 1,
      passt: false,
      grund: `${Math.round(neuBpm)} auf ${Math.round(laufendBpm)} BPM ist zu weit`,
    };
  }
  return { verhaeltnis: bester.verhaeltnis, passt: true, art: bester.art, zug: bester.zug };
}

// Kontextzeit eines Beats auf einem laufenden Deck.
//
//   startZeit   wann die Wiedergabe begann (Zeitachse des AudioContext)
//   startInDatei  ab welcher Stelle der Datei gestartet wurde
//   tempo       Abspielgeschwindigkeit
//
// Weil die Datei schneller oder langsamer laeuft, ist die Zeit in der Datei
// nicht die Zeit im Raum - deshalb die Division durch das Tempo.
function kontextZeitVonBeat(deck, beatNr) {
  const inDatei = beatZeit(deck.track, beatNr);
  return deck.startZeit + (inDatei - deck.startInDatei) / deck.tempo;
}

// Umgekehrt: Wo steht ein laufendes Deck jetzt in seiner Datei?
function stelleInDatei(deck, kontextZeit) {
  return deck.startInDatei + (kontextZeit - deck.startZeit) * deck.tempo;
}


// ===== public/gemeinsam/uebergang.js =====
// Wie kommt man von einem Track in den naechsten?
//
// Vorher gab es dafuer vier fertige Ablaufplaene, und die Regie hat einen
// davon gezogen. Das Ergebnis war beliebig: Derselbe 32-Beat-Plan lief ueber
// ein ausklingendes Outro genauso wie ueber zwei volle Grooves, und in einem
// der beiden Faelle war er falsch.
//
// Hier wird der Plan stattdessen aus den beiden Tracks *gerechnet*. Drei
// Fragen, in dieser Reihenfolge:
//
//   1. Wo verlaesst man den Alten? Nicht "25 Sekunden vor Schluss", sondern
//      da, wo er aufhoert zu tragen.
//   2. Wo steigt man in den Neuen ein? Bei hoher Energie *nicht* im ruhigen
//      Intro - dann bricht die Stimmung genau in dem Moment ein, in dem sie
//      halten soll. Dann lieber direkt in den Groove.
//   3. Was passiert dazwischen? Laenge, Bass-Uebergabe und Entzerrerfahrt
//      folgen daraus, was an genau diesen beiden Stellen wirklich klingt.
//
// Alles hier sind reine Funktionen ohne Web Audio - nachrechenbar in Node,
// siehe pruefungen/uebergang.mjs. Timing ist die Fehlerquelle Nummer eins beim
// Mischen, und ein Fehler hier klingt nicht nach Fehler, sondern nur nach
// "irgendwie schlecht".


// Wie tief der Bass gekappt wird, wenn ein Deck ihn abgeben muss.
const BASS_AUS = -32;

// Ab dieser Zielenergie gilt: keine Intros mehr, direkt in den Groove.
const PARTY_AB = 0.55;
// Und ab hier wird auch das Ausklingen des Alten nicht mehr abgewartet.
const KEIN_AUSKLANG_AB = 0.65;

// --- Das Profil lesen ------------------------------------------------------
//
// Das Profil kommt aus der Analyse: je Takt Energie, Bassanteil, Hoehenanteil
// und Anschlagsdichte. Alles hier drin arbeitet in Takten und rechnet erst am
// Ende in Beats um.

/** Mittelwert eines Feldes ueber einen Taktbereich. */
function mittelwert(profil, von, bis, feld) {
  const a = Math.max(0, Math.floor(von));
  const b = Math.min(profil.length, Math.ceil(bis));
  if (b <= a) return 0;
  let summe = 0;
  for (let i = a; i < b; i++) summe += profil[i][feld] ?? 0;
  return summe / (b - a);
}

/**
 * Wo traegt der Track?
 *
 * Gesucht ist die Schwelle, ab der ein Takt als "voll dabei" gilt. Ein fester
 * Wert taugt dafuer nicht: Ein durchgehend hartes Stueck hat nie einen leisen
 * Takt, ein verspieltes hat viele. Deshalb wird die Schwelle aus dem Track
 * selbst genommen - drei Viertel dessen, was seine lautesten Takte erreichen.
 */
function kernSchwelle(profil) {
  if (profil.length === 0) return 0;
  const sortiert = profil.map((p) => p.e).sort((a, b) => b - a);
  const oberesViertel = sortiert.slice(0, Math.max(1, Math.floor(sortiert.length / 4)));
  const spitze = oberesViertel.reduce((a, b) => a + b, 0) / oberesViertel.length;
  return spitze * 0.75;
}

/**
 * Der erste Takt, ab dem der Track durchgehend traegt.
 *
 * "Durchgehend" ist der Punkt: Ein einzelner lauter Takt im Intro ist ein
 * Anspieler, kein Groove. Verlangt werden vier Takte am Stueck.
 */
function kernAnfang(profil) {
  const schwelle = kernSchwelle(profil);
  let seit = -1;
  for (let i = 0; i < profil.length; i++) {
    if (profil[i].e >= schwelle) {
      if (seit < 0) seit = i;
      if (i - seit >= 3) return seit;
    } else {
      seit = -1;
    }
  }
  return 0;
}

/**
 * Der letzte Takt, an dem der Track noch traegt - danach kommt das Ausklingen.
 */
function kernEnde(profil) {
  const schwelle = kernSchwelle(profil);
  for (let i = profil.length - 1; i >= 0; i--) {
    if (profil[i].e >= schwelle) return i;
  }
  return Math.max(0, profil.length - 1);
}

// --- Einstieg: wo faengt der Neue an? --------------------------------------

/**
 * @param {object} track   mit profil, bpm, einstiegBeat, marken
 * @param {number} zielenergie 0..1 - die Stimmung, die gehalten werden soll
 * @returns {{beat:number, grund:string}}
 */
function einstiegWaehlen(track, zielenergie) {
  const profil = track.profil ?? [];
  const natuerlich = Math.max(0, Math.round(track.einstiegBeat ?? 0));

  if (profil.length < 4) {
    return { beat: natuerlich, grund: 'kein Verlauf bekannt, natuerlicher Einstieg' };
  }

  const kern = kernAnfang(profil);
  const kernBeat = kern * BEATS_PRO_TAKT;

  // Frueh am Abend darf ein Intro ein Intro sein. Es gibt der Nacht Luft, und
  // niemand tanzt um zehn.
  if (zielenergie < PARTY_AB) {
    return {
      beat: aufPhrase(natuerlich),
      grund: `Intro bleibt drin (Ziel ${(zielenergie * 100).toFixed(0)} %)`,
    };
  }

  // Ab hier zaehlt die Stimmung. Ein Intro von acht Takten ist ein Loch in der
  // Tanzflaeche - der Neue faengt da an, wo er wirklich losgeht.
  //
  // Eine Phrase davor, nicht exakt auf dem Kern: So kommt der Groove nicht aus
  // dem Nichts, sondern hat einen Takt Anlauf, und die Phrasengrenze stimmt.
  const vorlauf = zielenergie >= KEIN_AUSKLANG_AB ? 0 : BEATS_PRO_PHRASE;
  const ziel = Math.max(natuerlich, kernBeat - vorlauf);

  // Liegt kurz nach dem Kern ein Drop, ist der der bessere Einstieg - dann
  // faellt der Wechsel mit dem staerksten Moment des Tracks zusammen.
  const drop = (track.marken ?? [])
    .filter((m) => m.name === 'drop')
    .map((m) => m.beat)
    .find((b) => b >= kernBeat - BEATS_PRO_PHRASE && b <= kernBeat + BEATS_PRO_PHRASE * 4);

  if (drop !== undefined && zielenergie >= KEIN_AUSKLANG_AB) {
    return { beat: aufPhrase(drop), grund: `direkt auf den Drop bei Beat ${Math.round(drop)}` };
  }

  const uebersprungen = Math.round((ziel - natuerlich) / BEATS_PRO_TAKT);
  return {
    beat: aufPhrase(ziel),
    grund:
      uebersprungen > 1
        ? `${uebersprungen} Takte Intro uebersprungen, rein in den Groove`
        : 'gleich im Groove',
  };
}

// --- Ausstieg: wo verlaesst man den Alten? ---------------------------------

/**
 * @param {object} track   mit profil, dauer, bpm, raster
 * @param {number} zielenergie
 * @param {number} fruehestensBeat  vor diesem Beat nicht aussteigen
 */
function ausstiegWaehlen(track, zielenergie, fruehestensBeat = 0) {
  const profil = track.profil ?? [];
  const beatDauer = 60 / (track.bpm || 128);
  const letzterBeat = Math.max(0, ((track.dauer ?? 0) - (track.raster ?? 0)) / beatDauer);

  if (profil.length < 4) {
    const beat = aufPhrase(Math.max(fruehestensBeat, letzterBeat - BEATS_PRO_PHRASE * 2));
    return { beat, grund: 'kein Verlauf bekannt, kurz vor Schluss' };
  }

  const ende = kernEnde(profil);
  const endeBeat = (ende + 1) * BEATS_PRO_TAKT;

  // Bei hoher Zielenergie wird das Ausklingen nicht abgewartet. Ein Outro, das
  // sich ueber acht Takte verabschiedet, ist genau die Stelle, an der die
  // Tanzflaeche sich leert.
  if (zielenergie >= KEIN_AUSKLANG_AB) {
    const beat = aufPhrase(Math.max(fruehestensBeat, endeBeat - BEATS_PRO_PHRASE));
    return {
      beat: Math.min(beat, aufPhrase(letzterBeat)),
      grund: 'raus vor dem Ausklingen',
    };
  }

  // Sonst darf der Alte ausklingen - aber nicht bis zur Stille.
  const beat = aufPhrase(Math.max(fruehestensBeat, endeBeat));
  return { beat: Math.min(beat, aufPhrase(letzterBeat)), grund: 'nach dem letzten vollen Teil' };
}

function aufPhrase(beat) {
  return Math.max(0, Math.round(beat / BEATS_PRO_PHRASE) * BEATS_PRO_PHRASE);
}

// --- Der Uebergang selbst --------------------------------------------------

/**
 * Beschreibt, was an einer Stelle im Track wirklich klingt. Genau davon haengt
 * ab, wie man dort mischen kann.
 */
function stelleBeschreiben(profil, abTakt, takte = 4) {
  if (!profil || profil.length === 0) {
    return { energie: 0.6, bass: 0.5, hoehen: 0.2, dichte: 1.5, leer: true };
  }
  return {
    energie: mittelwert(profil, abTakt, abTakt + takte, 'e'),
    bass: mittelwert(profil, abTakt, abTakt + takte, 'b'),
    hoehen: mittelwert(profil, abTakt, abTakt + takte, 'h'),
    dichte: mittelwert(profil, abTakt, abTakt + takte, 'd'),
    leer: false,
  };
}

/**
 * Den ganzen Uebergang planen.
 *
 * @param {object} a  laufender Track (profil, bpm, raster, dauer, marken)
 * @param {object} b  naechster Track
 * @param {object} lage  { zielenergie, tempoPasst, jetztBeat }
 * @returns {{ausstiegBeat, einstiegBeat, beats, bassBeiBeat, art, name,
 *            begruendung, schritte}}
 */
function uebergangPlanen(
  a,
  b,
  { zielenergie = 0.5, tempoPasst = true, jetztBeat = 0, letzteArt = null } = {},
) {
  const ziel = Math.min(1, Math.max(0, zielenergie));

  const einstieg = einstiegWaehlen(b, ziel);
  const ausstieg = ausstiegWaehlen(a, ziel, jetztBeat + BEATS_PRO_PHRASE);
  const bStelle = stelleBeschreiben(b.profil, einstieg.beat / BEATS_PRO_TAKT);

  /*
   * Der Ausstieg braucht Auslauf.
   *
   * Ein Track, der bis zum letzten Takt durchzieht, hat seinen letzten
   * tragenden Takt am Ende der Datei - und dort anzusetzen hiesse, den
   * Uebergang gegen Stille zu mischen. Der Alte muss noch so lange spielen,
   * wie der Uebergang dauert.
   *
   * Henne und Ei: Die Laenge haengt davon ab, was an der Ausstiegsstelle
   * klingt, und die Stelle haengt an der Laenge. Also erst mit dem
   * vorlaeufigen Ausstieg waehlen, dann zurueckschieben und noch einmal
   * waehlen. Ein Durchgang genuegt - die Laenge aendert sich dabei hoechstens
   * um eine Stufe.
   */
  const beatDauerA = 60 / (a.bpm || 128);
  const letzterBeatA = Math.max(0, ((a.dauer ?? 0) - (a.raster ?? 0)) / beatDauerA);
  const zurueckAufPhrase = (beat) => Math.max(0, Math.floor(beat / BEATS_PRO_PHRASE) * BEATS_PRO_PHRASE);

  let ausstiegBeat = ausstieg.beat;
  let aStelle = stelleBeschreiben(a.profil, ausstiegBeat / BEATS_PRO_TAKT);
  let wahl = artWaehlen({ aStelle, bStelle, ziel, tempoPasst, letzteArt });

  const platzMachen = (laenge) => zurueckAufPhrase(Math.min(ausstieg.beat, letzterBeatA - laenge));
  if (ausstiegBeat + wahl.beats > letzterBeatA) {
    ausstiegBeat = platzMachen(wahl.beats);
    aStelle = stelleBeschreiben(a.profil, ausstiegBeat / BEATS_PRO_TAKT);
    wahl = artWaehlen({ aStelle, bStelle, ziel, tempoPasst, letzteArt });
    // Nach der zweiten Wahl noch einmal deckeln, falls sie laenger ausfiel.
    if (ausstiegBeat + wahl.beats > letzterBeatA) ausstiegBeat = platzMachen(wahl.beats);
  }

  const beats = wahl.beats;

  // Wann wechselt das Fundament das Deck?
  //
  // Zwei Bassdrums uebereinander sind Matsch, also gehoert der Keller zu jedem
  // Zeitpunkt genau einem Deck. Der richtige Moment dafuer haengt daran, wer
  // gerade traegt: Kommt der Neue voll herein, darf er den Bass frueh haben.
  // Ist sein Einstieg duenn, behaelt ihn der Alte, bis der Neue steht.
  const frueh = bStelle.energie >= aStelle.energie * 0.9;
  const bassBeiBeat = Math.round(beats * (frueh ? 0.35 : 0.62));

  return {
    ausstiegBeat,
    einstiegBeat: einstieg.beat,
    beats,
    bassBeiBeat,
    art: wahl.art,
    name: wahl.name,
    begruendung: `${wahl.grund} · ${einstieg.grund} · Ausstieg: ${ausstieg.grund}`,
    schritte: schritteBauen({ beats, bassBeiBeat, art: wahl.art, aStelle, bStelle }),
  };
}

/**
 * Welche Art Uebergang traegt an diesen beiden Stellen?
 *
 * Die Reihenfolge ist bewusst: Erst die Faelle, in denen ueberhaupt nur eines
 * geht, dann die, in denen man waehlen kann.
 */
function artWaehlen({ aStelle, bStelle, ziel, tempoPasst, letzteArt = null }) {
  // Ohne gemeinsames Tempo laufen zwei Beats gegeneinander. Dagegen hilft kein
  // Entzerrer - nur Ueberlappung vermeiden. Hier gibt es nichts zu waehlen.
  if (!tempoPasst) {
    return {
      art: 'echo',
      name: 'Echo-Schnitt',
      beats: 8,
      grund: 'Tempo passt nicht, also kein Uebereinander',
    };
  }

  const beideVoll = aStelle.energie > 0.6 && bStelle.energie > 0.6;
  const beideDicht = aStelle.dichte > 1.5 && bStelle.dichte > 1.5;
  const aehnlich = Math.abs(aStelle.hoehen - bStelle.hoehen) < 0.08 && aStelle.hoehen > 0.15;

  // Jede Moeglichkeit bekommt eine Eignung. Ein einzelnes if-Geflecht haette
  // immer genau eine Antwort - und damit ueber einen Abend immer dieselbe,
  // sobald die Lage sich nicht aendert. Mit einer Rangfolge gibt es eine
  // zweitbeste Wahl, und die wird unten gebraucht.
  const kandidaten = [
    {
      art: 'blende',
      name: 'Lange Blende',
      beats: beideVoll ? 32 : 24,
      grund: 'zwei laufende Grooves, in Ruhe uebergeben',
      // Lange Blenden brauchen zwei tragende Stellen und Zeit. Spaet am Abend
      // nehmen sie dem Moment die Kante.
      eignung: 0.6 + (beideVoll ? 0.25 : 0) - Math.max(0, ziel - KEIN_AUSKLANG_AB) * 1.6,
    },
    {
      art: 'blende',
      name: 'Lange Blende',
      beats: 32,
      grund: 'der Neue kommt duenn herein und darf sich legen',
      eignung: bStelle.energie < 0.5 && aStelle.energie > 0.55 ? 1.1 : 0,
    },
    {
      art: 'aufzug',
      name: 'Kurzer Aufzug',
      beats: 16,
      grund: 'der Alte traegt nicht mehr, der Neue schon',
      eignung: aStelle.energie < 0.45 && bStelle.energie > 0.6 ? 1.2 : 0.45,
    },
    {
      art: 'aufzug',
      name: 'Aufzug mit Trennung',
      beats: 16,
      grund: 'aehnliche Klangbilder, kurz halten statt Matsch',
      eignung: aehnlich && beideDicht ? 1.0 : 0,
    },
    {
      art: 'schnitt',
      name: 'Harter Schnitt auf die Phrase',
      beats: 4,
      // Ein Schnitt braucht auf beiden Seiten etwas, das traegt - sonst ist er
      // kein Zug, sondern ein Loch.
      grund: 'beide auf Anschlag, Schnitt haelt die Kante',
      eignung: beideVoll && beideDicht ? 0.35 + Math.max(0, ziel - PARTY_AB) * 2.2 : 0,
    },
    {
      art: 'echo',
      name: 'Echo-Schnitt',
      beats: 8,
      grund: 'kurz weggehallt statt lang gemischt',
      eignung: beideVoll ? 0.3 + Math.max(0, ziel - PARTY_AB) * 1.4 : 0.15,
    },
  ].filter((k) => k.eignung > 0);

  kandidaten.sort((x, y) => y.eignung - x.eignung);

  /*
   * Nicht zweimal hintereinander derselbe Zug.
   *
   * Das ist keine Kosmetik. Bei gleichbleibender Lage - und spaet am Abend ist
   * die Lage lange gleich - liefert eine Rangfolge immer denselben Sieger, und
   * dann besteht eine Stunde aus lauter harten Schnitten. Das hoert sich
   * genauso nach Maschine an wie eine Stunde aus lauter langen Blenden.
   *
   * Gewechselt wird nur, wenn die zweitbeste Wahl nicht deutlich schlechter
   * ist. Ein Uebergang, der nicht passt, ist schlimmer als eine Wiederholung.
   */
  const bester = kandidaten[0];
  if (letzteArt && bester && bester.art === letzteArt) {
    const anders = kandidaten.find((k) => k.art !== letzteArt && k.eignung >= bester.eignung * 0.7);
    if (anders) return { ...anders, grund: `${anders.grund} (nicht zweimal dasselbe)` };
  }
  return bester ?? {
    art: 'blende',
    name: 'Lange Blende',
    beats: 24,
    grund: 'Standard',
  };
}

/**
 * Aus dem Plan die Automationskurven bauen.
 *
 * Dieselbe Form wie frueher die festen Ablaufplaene - eine Liste von
 * Zielwerten auf einer Beat-Achse -, nur eben gerechnet statt abgeschrieben.
 * Jede Kurve muss bei Beat 0 ihren Ausgangswert nennen, sonst weiss der
 * Browser nicht, von wo aus er rampen soll, und macht aus jeder Blende einen
 * Sprung.
 */
function schritteBauen({ beats, bassBeiBeat, art, aStelle, bStelle }) {
  const s = [];
  const bassVor = Math.max(0.5, bassBeiBeat - 1);
  const bassNach = Math.min(beats, bassBeiBeat + 1);

  if (art === 'schnitt') {
    s.push({ beat: 0, deck: 'neu', regler: 'blende', wert: 1 });
    s.push({ beat: 0, deck: 'neu', regler: 'tief', wert: 0 });
    s.push({ beat: 0, deck: 'alt', regler: 'blende', wert: 1 });
    // Nicht ganz hart: 30 Millisekunden verhindern das Knacken, hoerbar ist
    // der Unterschied zum Schnitt nicht.
    s.push({ beat: 0.05, deck: 'alt', regler: 'blende', wert: 0 });
    s.push({ beat: 0, deck: 'alt', regler: 'tief', wert: 0 });
    s.push({ beat: 0.05, deck: 'alt', regler: 'tief', wert: BASS_AUS });
    return s;
  }

  if (art === 'echo') {
    s.push({ beat: 0, deck: 'neu', regler: 'blende', wert: 1 });
    s.push({ beat: 0, deck: 'neu', regler: 'tief', wert: 0 });
    // Erst den Hall aufmachen, dann die Quelle wegnehmen - der Rest haengt
    // noch ein paar Schlaege in der Luft und loest sich auf.
    s.push({ beat: 0, deck: 'alt', regler: 'echo', wert: 0 });
    s.push({ beat: 0.5, deck: 'alt', regler: 'echo', wert: 0.6 });
    s.push({ beat: Math.min(2, beats / 4), deck: 'alt', regler: 'echo', wert: 0.6 });
    s.push({ beat: Math.min(4, beats / 2), deck: 'alt', regler: 'echo', wert: 0 });
    s.push({ beat: 0, deck: 'alt', regler: 'blende', wert: 1 });
    s.push({ beat: 1.5, deck: 'alt', regler: 'blende', wert: 1 });
    s.push({ beat: 2, deck: 'alt', regler: 'blende', wert: 0 });
    s.push({ beat: 0, deck: 'alt', regler: 'tief', wert: 0 });
    s.push({ beat: 2, deck: 'alt', regler: 'tief', wert: BASS_AUS });
    return s;
  }

  // --- Blende und Aufzug teilen sich das Grundgeruest ---------------------

  // Wie schnell der Neue aufgeht, haengt daran, wie voll er einsteigt. Ein
  // dichter Einstieg braucht Zeit, sonst ueberfaehrt er den Alten; eine
  // duenne Flaeche darf schneller da sein, sie stoert niemanden.
  const neuOffen = Math.round(beats * (bStelle.dichte > 2 ? 0.6 : 0.42));
  s.push({ beat: 0, deck: 'neu', regler: 'blende', wert: 0 });
  s.push({ beat: neuOffen, deck: 'neu', regler: 'blende', wert: 1 });

  // Der Neue kommt ohne Bass und bekommt ihn bei der Uebergabe.
  s.push({ beat: 0, deck: 'neu', regler: 'tief', wert: BASS_AUS });
  s.push({ beat: bassVor, deck: 'neu', regler: 'tief', wert: BASS_AUS });
  s.push({ beat: bassNach, deck: 'neu', regler: 'tief', wert: 0 });

  // Der Alte gibt ihn im selben Moment ab.
  s.push({ beat: 0, deck: 'alt', regler: 'tief', wert: 0 });
  s.push({ beat: bassVor, deck: 'alt', regler: 'tief', wert: 0 });
  s.push({ beat: bassNach, deck: 'alt', regler: 'tief', wert: BASS_AUS });

  // Der Alte haelt, bis der Neue steht, und geht dann.
  s.push({ beat: 0, deck: 'alt', regler: 'blende', wert: 1 });
  s.push({ beat: Math.round(beats * 0.62), deck: 'alt', regler: 'blende', wert: 1 });
  s.push({ beat: beats, deck: 'alt', regler: 'blende', wert: 0 });

  if (art === 'aufzug') {
    // Dem Alten wird von unten der Boden weggezogen, bis nur noch ein duenner
    // Rest ueber dem Neuen liegt.
    s.push({ beat: 0, deck: 'alt', regler: 'filter', wert: 20 });
    s.push({ beat: Math.round(beats * 0.25), deck: 'alt', regler: 'filter', wert: 120 });
    s.push({ beat: Math.round(beats * 0.75), deck: 'alt', regler: 'filter', wert: 900 });
    s.push({ beat: beats - 1, deck: 'alt', regler: 'filter', wert: 4000 });
  } else {
    // Bei der langen Blende wird der Alte gegen Ende in den Hoehen
    // zurueckgenommen. Wie stark, haengt davon ab, wie sehr sich die beiden
    // im Hochtonbereich ins Gehege kommen - sind beide hell, wird mehr
    // getrennt, sonst bleibt es unauffaellig.
    const gedraenge = Math.min(aStelle.hoehen, bStelle.hoehen);
    const absenkung = gedraenge > 0.18 ? -14 : gedraenge > 0.1 ? -9 : -5;
    s.push({ beat: 0, deck: 'alt', regler: 'hoch', wert: 0 });
    s.push({ beat: Math.round(beats * 0.6), deck: 'alt', regler: 'hoch', wert: 0 });
    s.push({ beat: Math.round(beats * 0.94), deck: 'alt', regler: 'hoch', wert: absenkung });
  }

  return s;
}


// ===== public/gemeinsam/mixer.js =====
// Zwei Decks, ein Ausgang. Hier entsteht der Klang des Abends.
//
// Aufbau eines Decks:
//
//   Quelle -> Angleich -> Tief -> Mitte -> Hoch -> Filter -> Regler -> Summe
//                                                        \-> Echo-Weg -> Summe
//
//   Angleich  gleicht die Lautheit an (aus der Messung beim Einlesen)
//   Tief/Mitte/Hoch  der Dreiband-Entzerrer, Tief traegt den Bass-Tausch
//   Filter    Hochpass fuer Aufzuege, im Ruhezustand durchlaessig
//   Regler    die eigentliche Blende
//
// Die Summe laeuft ueber einen Begrenzer. Zwei Tracks gleichzeitig sind
// zusammen lauter als einer - ohne Kopfraum verzerrt genau der Moment, auf den
// alle warten.


// Wie tief der Bass gekappt wird, wenn ein Deck ihn abgeben muss. Steht in
// uebergang.js, weil die gerechneten Plaene ihn genauso brauchen.

// --- Uebergaenge als Ablaufplan -------------------------------------------
//
// Jeder Uebergang ist eine Liste von Zielwerten auf einer Beat-Achse. Als
// Daten statt als Code, damit die Buehne mitzeichnen kann, was gerade passiert,
// und damit ein neuer Uebergang ein paar Zeilen ist und keine neue Funktion.

// Jede Kurve beginnt bei Beat 0 mit ihrem Ausgangswert. Das ist keine
// Foermelei: Ohne diesen Startpunkt weiss der Browser nicht, von wo aus er
// rampen soll, und macht aus jeder Blende einen Sprung. Haltepunkte
// (derselbe Wert zweimal) formen die Kurve - erst halten, dann bewegen.
const UEBERGAENGE = {
  blende: {
    name: 'Lange Blende',

// --- Ein Deck -------------------------------------------------------------

class Deck {
  constructor(ctx, summe, echoWeg, name) {
    this.ctx = ctx;
    this.name = name;
    this.track = null;
    this.quelle = null;
    this.startZeit = 0;
    this.startInDatei = 0;
    this.tempo = 1;
    this.laeuft = false;

    this.angleich = ctx.createGain();
    this.tief = ctx.createBiquadFilter();
    this.mitte = ctx.createBiquadFilter();
    this.hoch = ctx.createBiquadFilter();
    this.filter = ctx.createBiquadFilter();
    this.blende = ctx.createGain();
    this.echo = ctx.createGain();

    this.tief.type = 'lowshelf';
    this.tief.frequency.value = 200;
    this.mitte.type = 'peaking';
    this.mitte.frequency.value = 1000;
    this.mitte.Q.value = 0.8;
    this.hoch.type = 'highshelf';
    this.hoch.frequency.value = 4000;

    // Im Ruhezustand durchlaessig: 20 Hz Hochpass hoert man nicht.
    this.filter.type = 'highpass';
    this.filter.frequency.value = 20;
    this.filter.Q.value = 0.8;

    this.blende.gain.value = 0;
    this.echo.gain.value = 0;

    this.angleich
      .connect(this.tief)
      .connect(this.mitte)
      .connect(this.hoch)
      .connect(this.filter)
      .connect(this.blende)
      .connect(summe);
    this.blende.connect(this.echo).connect(echoWeg);
  }

  // Der Regler hinter einem Namen aus dem Ablaufplan.
  parameter(regler) {
    switch (regler) {
      case 'blende':
        return this.blende.gain;
      case 'tief':
        return this.tief.gain;
      case 'mitte':
        return this.mitte.gain;
      case 'hoch':
        return this.hoch.gain;
      case 'filter':
        return this.filter.frequency;
      case 'echo':
        return this.echo.gain;
      default:
        throw new Error(`unbekannter Regler: ${regler}`);
    }
  }

  // Alles auf Anfang, ohne Knacken.
  zuruecksetzen(zeit) {
    for (const [regler, wert] of [
      ['tief', 0],
      ['mitte', 0],
      ['hoch', 0],
      ['filter', 20],
      ['echo', 0],
    ]) {
      const p = this.parameter(regler);
      p.cancelScheduledValues(zeit);
      p.setValueAtTime(wert, zeit);
    }
  }

  starten({ track, puffer, zeit, startInDatei, tempo, blende }) {
    this.stoppen(zeit);

    const quelle = this.ctx.createBufferSource();
    quelle.buffer = puffer;
    quelle.playbackRate.value = tempo;
    quelle.connect(this.angleich);

    // Lautheitsangleich aus der Messung. Ohne den springt der naechste Track
    // um bis zu zwoelf Dezibel - der haesslichste Fehler ueberhaupt.
    const db = track.angleichDb ?? 0;
    this.angleich.gain.cancelScheduledValues(zeit);
    this.angleich.gain.setValueAtTime(10 ** (db / 20), zeit);

    this.zuruecksetzen(zeit);
    this.blende.gain.cancelScheduledValues(zeit);
    this.blende.gain.setValueAtTime(blende, zeit);

    quelle.start(zeit, Math.max(0, startInDatei));

    this.quelle = quelle;
    this.track = track;
    this.geplanterAnker = null;
    this.startZeit = zeit;
    this.startInDatei = startInDatei;
    this.tempo = tempo;
    this.laeuft = true;
  }

  // Eine Verankerung, die erst spaeter gilt. Ein Loop-Roll wiederholt Material,
  // also laufen Musikzeit und Dateizeit auseinander; ab dem Zielbeat stimmt
  // beides wieder, und genau dann wird umgehaengt.
  verankernAb(abZeit, startZeit, startInDatei) {
    this.geplanterAnker = { abZeit, startZeit, startInDatei };
  }

  ankerPruefen() {
    const geplant = this.geplanterAnker;
    if (geplant && this.ctx.currentTime >= geplant.abZeit) {
      this.startZeit = geplant.startZeit;
      this.startInDatei = geplant.startInDatei;
      this.geplanterAnker = null;
    }
  }

  stoppen(zeit) {
    this.geplanterAnker = null;
    if (!this.quelle) return;
    try {
      this.quelle.stop(zeit);
    } catch {
      // Schon gestoppt - macht nichts.
    }
    this.quelle = null;
    this.laeuft = false;
  }

  // Wo steht das Deck jetzt in seiner Datei?
  stelle(jetzt = this.ctx.currentTime) {
    if (!this.laeuft) return 0;
    this.ankerPruefen();
    return stelleInDatei(this, jetzt);
  }

  // Das tatsaechlich klingende Tempo, inklusive Angleich.
  effektivBpm() {
    return this.track ? this.track.bpm * this.tempo : null;
  }
}

// --- Der Mixer ------------------------------------------------------------

class Mixer {
  constructor(ctx) {
    this.ctx = ctx;
    this.wechselZaehler = 0;
    this.laufenderUebergang = null;

    this.summe = ctx.createGain();
    this.begrenzer = ctx.createDynamicsCompressor();
    this.ausgang = ctx.createGain();
    this.messung = ctx.createAnalyser();

    // Kopfraum: die Summe laeuft mit Reserve, der Begrenzer faengt nur die
    // Spitzen ab. Er soll nicht dauernd arbeiten, sondern nur verhindern, dass
    // ein Uebergang in die Verzerrung laeuft.
    this.summe.gain.value = 0.55;
    this.begrenzer.threshold.value = -3;
    this.begrenzer.knee.value = 0;
    this.begrenzer.ratio.value = 20;
    this.begrenzer.attack.value = 0.002;
    this.begrenzer.release.value = 0.15;
    this.ausgang.gain.value = 1;

    this.messung.fftSize = 2048;
    this.messung.smoothingTimeConstant = 0.75;

    // Der Echo-Weg fuer den Echo-Schnitt: eine Verzoegerung mit Rueckfuehrung,
    // die sich von selbst totlaeuft.
    this.echoWeg = ctx.createGain();
    this.verzoegerung = ctx.createDelay(2);
    this.rueckfuehrung = ctx.createGain();
    this.verzoegerung.delayTime.value = 0.35;
    this.rueckfuehrung.gain.value = 0.45;
    this.echoWeg.connect(this.verzoegerung);
    this.verzoegerung.connect(this.rueckfuehrung).connect(this.verzoegerung);
    this.verzoegerung.connect(this.summe);

    this.summe.connect(this.begrenzer).connect(this.ausgang);
    this.ausgang.connect(this.messung);
    this.ausgang.connect(ctx.destination);

    this.decks = [new Deck(ctx, this.summe, this.echoWeg, 'A'), new Deck(ctx, this.summe, this.echoWeg, 'B')];
    this.aktiv = 0;
  }

  get laufendesDeck() {
    return this.decks[this.aktiv];
  }

  get freiesDeck() {
    return this.decks[1 - this.aktiv];
  }

  // Der allererste Track: einfach einblenden, es gibt ja nichts zu mischen.
  ersterTrack(track, puffer, einblendSekunden = 2) {
    const jetzt = this.ctx.currentTime + 0.1;
    const deck = this.laufendesDeck;

    // Der erste Track darf von vorne laufen - ein Intro, das langsam aufgeht,
    // ist als Einstieg in den Abend genau richtig. Nur beim *Mischen* ist ein
    // Intro unbrauchbar, weil es keinen Beat zum Anlegen hat.
    deck.starten({
      track,
      puffer,
      zeit: jetzt,
      startInDatei: 0,
      tempo: 1,
      blende: 0,
    });
    deck.blende.gain.linearRampToValueAtTime(1, jetzt + einblendSekunden);
    return { deck: deck.name, track };
  }

  // Uebergang planen und einplanen. Gibt zurueck, was passieren wird - die
  // Buehne zeigt das an, bevor man es hoert.
  uebergang(neuTrack, puffer, artWunsch = null, zielenergie = 0.5) {
    const alt = this.laufendesDeck;
    const neu = this.freiesDeck;
    if (!alt.laeuft) return this.ersterTrack(neuTrack, puffer);

    const jetzt = this.ctx.currentTime;
    const beatSekundeAlt = beatDauer(alt.track.bpm) / alt.tempo;

    const tempo = tempoVerhaeltnis(alt.effektivBpm(), neuTrack.bpm);
    const energiesprung = (neuTrack.energie ?? 0.5) - (alt.track.energie ?? 0.5);

    /*
     * Der Plan wird aus den beiden Tracks gerechnet, nicht aus einer Liste
     * gezogen: wo der Alte aufhoert zu tragen, wo der Neue wirklich losgeht,
     * und was an genau diesen beiden Stellen klingt. Siehe uebergang.js.
     *
     * artWunsch kommt vom Knopf auf der Buehne und sticht - beim Entwickeln
     * will man eine bestimmte Art hoeren koennen, ohne die Lage passend
     * hinzubiegen.
     */
    const plan = uebergangPlanen(alt.track, neuTrack, {
      zielenergie,
      tempoPasst: tempo.passt,
      jetztBeat: beatBei(alt.track, alt.stelle(jetzt)),
      // Damit nicht eine Stunde lang derselbe Zug kommt.
      letzteArt: this.letzteArt ?? null,
    });
    const art = artWunsch ?? plan.art;
    const schritte = artWunsch ? UEBERGAENGE[artWunsch].schritte : plan.schritte;
    const beats = artWunsch ? UEBERGAENGE[artWunsch].beats : plan.beats;
    const name = artWunsch ? UEBERGAENGE[artWunsch].name : plan.name;

    // Der Uebergang beginnt auf einer Phrasengrenze des laufenden Decks. Das
    // ist der Unterschied zwischen "gemischt" und "uebereinandergelegt".
    // Vorlauf: der Uebergang muss noch vor dem Ende des alten Tracks passen.
    const vorlaufBeats = Math.max(2, Math.ceil(0.3 / beatSekundeAlt));
    const startBeat = beats > 1
      ? naechstePhrase(alt.track, alt.stelle(jetzt), vorlaufBeats)
      : naechsterTakt(alt.track, alt.stelle(jetzt), vorlaufBeats);
    const startZeit = kontextZeitVonBeat(alt, startBeat);

    // Der Neue steigt dort ein, wo der Plan es sagt - bei hoher Energie
    // mitten im Groove statt im Intro.
    const einstiegBeat = artWunsch ? (neuTrack.einstiegBeat ?? 0) : plan.einstiegBeat;
    const einstieg = beatZeit(neuTrack, einstiegBeat);

    neu.starten({
      track: neuTrack,
      puffer,
      zeit: startZeit,
      startInDatei: Math.max(0, einstieg),
      tempo: tempo.verhaeltnis,
      blende: art === 'echo' || art === 'schnitt' ? 1 : 0,
    });

    // Der neue Beat bestimmt ab jetzt das Raster - er laeuft ja schon im
    // Zieltempo.
    const beatSekunde = beatDauer(neuTrack.bpm) / tempo.verhaeltnis;

    // Die Schritte nach Regler gruppieren und je Regler *eine* durchgehende
    // Kurve planen. Das ist der Punkt, an dem eine Blende zur Blende wird:
    // Web Audio rampt immer vom letzten geplanten Ereignis zum naechsten.
    // Wer stattdessen vor jeder Rampe neu ankert, bekommt an jedem Zielpunkt
    // einen Sprung statt einer Bewegung - hoerbar als Klacken, nicht als Mix.
    const gruppen = new Map();
    for (const schritt of schritte) {
      const schluessel = `${schritt.deck}:${schritt.regler}`;
      if (!gruppen.has(schluessel)) gruppen.set(schluessel, []);
      gruppen.get(schluessel).push(schritt);
    }

    for (const [schluessel, schritte] of gruppen) {
      const [welches, regler] = schluessel.split(':');
      const deck = welches === 'alt' ? alt : neu;
      const param = deck.parameter(regler);
      schritte.sort((a, b) => a.beat - b.beat);

      param.cancelScheduledValues(startZeit);
      // Der Wert bei Beat 0 ist der Startpunkt der Kurve. Jeder Ablaufplan
      // nennt ihn ausdruecklich, damit hier nichts geraten werden muss.
      const start = schritte[0].beat === 0 ? schritte[0].wert : param.value;
      param.setValueAtTime(start, startZeit);

      for (const schritt of schritte) {
        if (schritt.beat === 0) continue;
        param.linearRampToValueAtTime(schritt.wert, startZeit + schritt.beat * beatSekunde);
      }
    }

    const endeZeit = startZeit + beats * beatSekunde;
    alt.stoppen(endeZeit + 0.05);

    this.aktiv = 1 - this.aktiv;
    this.wechselZaehler++;
    this.letzteArt = art;

    this.laufenderUebergang = {
      art,
      name,
      beschreibung: artWunsch ? UEBERGAENGE[artWunsch].beschreibung : plan.begruendung,
      beats,
      einstiegBeat,
      ausstiegBeat: plan.ausstiegBeat,
      startZeit,
      endeZeit,
      vonTrack: alt.track,
      nachTrack: neuTrack,
      tempo,
      energiesprung,
      grund: tempo.passt ? null : tempo.grund,
    };
    return this.laufenderUebergang;
  }

  // Wie lange laeuft der aktuelle Track noch? Danach richtet sich, wann der
  // naechste vorbereitet werden muss.
  restSekunden() {
    const deck = this.laufendesDeck;
    if (!deck.laeuft || !deck.quelle?.buffer) return Infinity;
    const uebrig = deck.quelle.buffer.duration - deck.stelle();
    return uebrig / deck.tempo;
  }

  // Momentaufnahme fuer die Anzeige.
  zustand() {
    const jetzt = this.ctx.currentTime;
    const uebergang = this.laufenderUebergang;
    return {
      jetzt,
      decks: this.decks.map((deck) => ({
        name: deck.name,
        laeuft: deck.laeuft,
        aktiv: deck === this.laufendesDeck,
        track: deck.track,
        stelle: deck.stelle(jetzt),
        dauer: deck.quelle?.buffer?.duration ?? 0,
        tempo: deck.tempo,
        bpm: deck.effektivBpm(),
        blende: deck.blende.gain.value,
        tief: deck.tief.gain.value,
        filter: deck.filter.frequency.value,
      })),
      uebergang:
        uebergang && jetzt <= uebergang.endeZeit + 0.5
          ? {
              ...uebergang,
              fortschritt: fortschritt(jetzt, uebergang),
              // Ein Uebergang wartet auf die naechste Phrasengrenze - das
              // koennen fuenfzehn Sekunden sein. Ohne Anzeige wirkt der Knopf
              // kaputt, dabei tut er genau das Richtige.
              startetIn: Math.max(0, uebergang.startZeit - jetzt),
            }
          : null,
      pegel: this.pegel(),
    };
  }

  // Ausgangspegel als Effektivwert. Der Wachhund haengt daran: Bleibt der
  // laenger bei null, obwohl etwas laufen sollte, stimmt etwas nicht.
  pegel() {
    const daten = new Float32Array(this.messung.fftSize);
    this.messung.getFloatTimeDomainData(daten);
    let summe = 0;
    for (const wert of daten) summe += wert * wert;
    return Math.sqrt(summe / daten.length);
  }

  // Spektrum fuer die Buehne.
  spektrum(ziel) {
    this.messung.getByteFrequencyData(ziel);
    return ziel;
  }

  // Die Wellenform im Zeitbereich - der Modus "Wellen" zeichnet sie direkt.
  //
  // Bewusst die Float-Fassung und nicht getByteTimeDomainData: Der Pegel am
  // Ausgang liegt nach Angleich und Begrenzer bei wenigen Prozent der
  // Vollaussteuerung. Die Bytefassung hat dort nur noch eine Handvoll Stufen
  // uebrig, und die Zeichnung wird zur Treppe, sobald man sie hochskaliert.
  // @param {Float32Array} ziel  Laenge messung.fftSize
  wellenform(ziel) {
    this.messung.getFloatTimeDomainData(ziel);
    return ziel;
  }

}

function fortschritt(jetzt, uebergang) {
  if (jetzt <= uebergang.startZeit) return 0;
  const spanne = uebergang.endeZeit - uebergang.startZeit;
  return spanne <= 0 ? 1 : Math.min(1, (jetzt - uebergang.startZeit) / spanne);
}


// ===== public/gemeinsam/demomusik.js =====
// Musik aus dem Nichts, damit man den DJ hoeren kann, bevor es eine Bibliothek
// gibt.
//
// Das ist kein Ersatz fuer echte Tracks - es ist ein Pruefstand. Der Vorteil
// gegenueber echter Musik ist, dass hier *alles bekannt ist*: Tempo, Raster,
// Downbeats, Struktur, Energie. Damit laesst sich die Mischmaschine gegen
// perfekte Daten testen. Klingt ein Uebergang schlecht, liegt es dann am
// Mischen und nicht an einer verrutschten Beaterkennung - diese beiden Fehler
// auseinanderzuhalten ist sonst muehsam.
//
// Aufgebaut wie ein Clubtrack: Intro, Aufbau, Hauptteil, Breakdown, Drop, Outro.


const TAKTE = 64;

// Ein Moll-Grundton je Track, damit nicht alles gleich klingt.
const GRUNDTOENE = [55, 58.27, 61.74, 65.41, 69.3, 73.42, 49, 51.91];

const ABSCHNITTE = [
  { name: 'intro', vonTakt: 0, bisTakt: 8 },
  { name: 'aufbau', vonTakt: 8, bisTakt: 16 },
  { name: 'haupt', vonTakt: 16, bisTakt: 32 },
  { name: 'breakdown', vonTakt: 32, bisTakt: 40 },
  { name: 'drop', vonTakt: 40, bisTakt: 56 },
  { name: 'outro', vonTakt: 56, bisTakt: 64 },
];

// Kleiner, reproduzierbarer Zufall - derselbe Startwert ergibt denselben Track.
function wuerfel(startwert) {
  let zustand = startwert >>> 0;
  return () => {
    zustand = (zustand * 1664525 + 1013904223) >>> 0;
    return zustand / 4294967296;
  };
}

// Energie, Bassanteil, Hoehenanteil und Dichte je Abschnitt - so, wie der
// Generator unten die Takte tatsaechlich fuellt.
const PROFIL_JE_ABSCHNITT = {
  intro: { e: 0.28, b: 0.18, h: 0.12, d: 0.6 },
  aufbau: { e: 0.62, b: 0.55, h: 0.2, d: 1.6 },
  haupt: { e: 0.9, b: 0.72, h: 0.24, d: 2.4 },
  breakdown: { e: 0.4, b: 0.22, h: 0.16, d: 0.9 },
  drop: { e: 1, b: 0.78, h: 0.28, d: 2.8 },
  outro: { e: 0.5, b: 0.45, h: 0.14, d: 1.2 },
};

function demoProfil(energie) {
  const profil = [];
  for (let takt = 0; takt < TAKTE; takt++) {
    const werte = PROFIL_JE_ABSCHNITT[abschnittBei(takt).name] ?? PROFIL_JE_ABSCHNITT.haupt;
    // Energiereichere Tracks sind ueberall etwas voller.
    const zuschlag = 0.85 + energie * 0.3;
    profil.push({
      e: Number(Math.min(1, werte.e * zuschlag).toFixed(3)),
      b: werte.b,
      h: Number((werte.h * zuschlag).toFixed(3)),
      d: Number((werte.d * zuschlag).toFixed(2)),
    });
  }
  return profil;
}

function abschnittBei(takt) {
  return ABSCHNITTE.find((a) => takt >= a.vonTakt && takt < a.bisTakt) ?? ABSCHNITTE[0];
}

/**
 * Erzeugt einen vollstaendigen Demo-Track.
 * Gibt die Beschreibung (wie sie sonst aus der Analyse kaeme) und den Klang zurueck.
 */
function erzeugeTrack(ctx, { nummer, bpm, energie, titel }) {
  const zufall = wuerfel(nummer * 7919 + 13);
  const rate = ctx.sampleRate;
  const beatSekunden = 60 / bpm;
  const gesamtBeats = TAKTE * BEATS_PRO_TAKT;
  const dauer = gesamtBeats * beatSekunden + 1;
  const laenge = Math.ceil(dauer * rate);

  const puffer = ctx.createBuffer(2, laenge, rate);
  const links = puffer.getChannelData(0);
  const rechts = puffer.getChannelData(1);

  const grundton = GRUNDTOENE[nummer % GRUNDTOENE.length];

  // Absichtlich unterschiedlich laut abmischen. So laesst sich hoeren, was der
  // Lautheitsangleich tut - mit Angleich klingt der Abend wie aus einem Guss,
  // ohne springt jeder Wechsel.
  const versatzDb = -8 + zufall() * 10;
  const versatz = 10 ** (versatzDb / 20);

  for (let beat = 0; beat < gesamtBeats; beat++) {
    const takt = Math.floor(beat / BEATS_PRO_TAKT);
    const imTakt = beat % BEATS_PRO_TAKT;
    const abschnitt = abschnittBei(takt).name;
    const zeit = beat * beatSekunden;
    const start = Math.floor(zeit * rate);

    const bass = abschnitt !== 'intro' && abschnitt !== 'breakdown';
    const treibend = abschnitt === 'haupt' || abschnitt === 'drop';
    const wucht = abschnitt === 'drop' ? 1 : abschnitt === 'haupt' ? 0.85 : 0.6;

    // --- Bassdrum: das Rueckgrat, vier auf den Boden --------------------
    if (bass) {
      demoKick(links, rechts, start, rate, (0.85 + energie * 0.15) * wucht);
    } else if (abschnitt === 'intro' && takt >= 4 && imTakt === 0) {
      // Im Intro nur die Eins - so hat der Mixer schon einen Anker.
      demoKick(links, rechts, start, rate, 0.5);
    }

    // --- Clap auf zwei und vier -----------------------------------------
    if (treibend && (imTakt === 1 || imTakt === 3)) {
      clap(links, rechts, start, rate, 0.4 * wucht);
    }

    // --- Hihats: die Dichte macht die Energie ----------------------------
    const hutDichte = abschnitt === 'breakdown' ? 1 : treibend ? (energie > 0.5 ? 4 : 2) : 2;
    for (let i = 0; i < hutDichte; i++) {
      const versetzt = start + Math.floor(((i * beatSekunden) / hutDichte) * rate);
      const offbeat = i % 2 === 1;
      hut(links, rechts, versetzt, rate, (offbeat ? 0.22 : 0.12) * wucht, zufall());
    }

    // --- Bass: geduckt, damit die Kick durchkommt ------------------------
    if (bass) {
      const stufe = [0, 0, 3, 0, 5, 0, 3, -2][beat % 8];
      const freq = grundton * 2 ** (stufe / 12);
      bassTon(links, rechts, start, rate, beatSekunden, freq, 0.5 * wucht, energie);
    }

    // --- Flaeche und Stabs ------------------------------------------------
    if (abschnitt === 'breakdown' || abschnitt === 'intro') {
      if (imTakt === 0) {
        flaeche(links, rechts, start, rate, beatSekunden * 4, grundton * 4, 0.16);
      }
    } else if (treibend && imTakt === 2) {
      stab(links, rechts, start + Math.floor(beatSekunden * 0.5 * rate), rate, grundton * 4, 0.2 * wucht);
    }
  }

  // Gesamtpegel setzen und gegen Uebersteuern sichern.
  for (let i = 0; i < laenge; i++) {
    links[i] = weich(links[i] * versatz);
    rechts[i] = weich(rechts[i] * versatz);
  }

  const marken = ABSCHNITTE.map((a) => ({
    name: a.name,
    beat: a.vonTakt * BEATS_PRO_TAKT,
    sekunde: a.vonTakt * BEATS_PRO_TAKT * beatSekunden,
  }));

  return {
    track: {
      id: `demo-${nummer}`,
      titel,
      interpret: 'Pruefstand',
      bpm,
      // Wir erzeugen die Datei selbst, der erste Downbeat liegt also exakt auf null.
      raster: 0,
      // Nicht bei null einsteigen: Das Intro traegt nur Flaeche und Hihats, da
      // gibt es nichts, worauf sich mischen liesse. Der erste brauchbare
      // Downbeat ist der, an dem die Bassdrum durchlaeuft - Takt 8. Die
      // Analyse echter Tracks wird spaeter denselben Wert liefern.
      einstiegBeat: 8 * BEATS_PRO_TAKT,
      dauer,
      energie,
      note: 1,
      // Genau der Wert, der den absichtlichen Pegelversatz wieder aufhebt.
      angleichDb: Number((-versatzDb).toFixed(2)),
      versatzDb: Number(versatzDb.toFixed(2)),
      marken,
      // Der Verlauf je Takt, wie ihn die Analyse aus echter Musik liest. Hier
      // ist er nicht gemessen, sondern abgeschrieben - wir haben den Track ja
      // selbst nach diesen Abschnitten gebaut. Damit kann der Pruefstand
      // dieselbe Uebergangsplanung fahren wie eine echte Bibliothek.
      profil: demoProfil(energie),
      demo: true,
    },
    puffer,
  };
}

// Acht Tracks ueber die ganze Spannweite: chillig und langsam bis hart und schnell.
function demoBibliothek(ctx, beiFortschritt = () => {}) {
  const vorgaben = [
    { bpm: 118, energie: 0.12, titel: 'Erstes Licht' },
    { bpm: 120, energie: 0.25, titel: 'Langsam voll' },
    { bpm: 122, energie: 0.38, titel: 'Erste Bewegung' },
    { bpm: 124, energie: 0.5, titel: 'Es traegt' },
    { bpm: 126, energie: 0.62, titel: 'Kein Zurueck' },
    { bpm: 128, energie: 0.74, titel: 'Vollgas' },
    { bpm: 130, energie: 0.86, titel: 'Brett' },
    { bpm: 132, energie: 0.95, titel: 'Letzte Runde' },
  ];

  const fertig = [];
  for (const [nummer, vorgabe] of vorgaben.entries()) {
    beiFortschritt(nummer, vorgaben.length, vorgabe.titel);
    fertig.push(erzeugeTrack(ctx, { nummer, ...vorgabe }));
  }
  beiFortschritt(vorgaben.length, vorgaben.length, null);
  return fertig;
}

// --- Klangerzeuger --------------------------------------------------------

// Bassdrum: Sinus, dessen Tonhoehe schnell nach unten faellt. Der Klick am
// Anfang gibt ihr die Durchsetzungskraft.
function demoKick(links, rechts, start, rate, staerke) {
  const laenge = Math.floor(0.4 * rate);
  let phase = 0;
  for (let i = 0; i < laenge; i++) {
    const stelle = start + i;
    if (stelle >= links.length) break;
    const t = i / rate;
    const freq = 48 + 110 * Math.exp(-t / 0.022);
    phase += (2 * Math.PI * freq) / rate;
    const huelle = Math.exp(-t / 0.11);
    const klick = i < 40 ? (1 - i / 40) * 0.35 : 0;
    const wert = (Math.sin(phase) * huelle + klick) * staerke;
    links[stelle] += wert;
    rechts[stelle] += wert;
  }
}

// Clap: mehrere kurze Rauschstoesse kurz hintereinander, dann ein Nachhall.
function clap(links, rechts, start, rate, staerke) {
  const laenge = Math.floor(0.22 * rate);
  let hp = 0;
  let vorher = 0;
  for (let i = 0; i < laenge; i++) {
    const stelle = start + i;
    if (stelle >= links.length) break;
    const t = i / rate;
    // Drei Anrisse, dann der Schwanz.
    const anriss = t < 0.03 ? (Math.floor(t / 0.009) % 2 === 0 ? 1 : 0.35) : Math.exp(-(t - 0.03) / 0.055);
    const roh = Math.random() * 2 - 1;
    hp = 0.86 * (hp + roh - vorher);
    vorher = roh;
    const wert = hp * anriss * staerke;
    links[stelle] += wert * 0.9;
    rechts[stelle] += wert;
  }
}

// Hihat: sehr kurzes, helles Rauschen. Leicht nach links/rechts gestreut.
function hut(links, rechts, start, rate, staerke, streuung) {
  const laenge = Math.floor(0.05 * rate);
  let hp = 0;
  let vorher = 0;
  const nachLinks = 0.5 + (streuung - 0.5) * 0.5;
  for (let i = 0; i < laenge; i++) {
    const stelle = start + i;
    if (stelle >= links.length) break;
    const huelle = Math.exp(-(i / rate) / 0.012);
    const roh = Math.random() * 2 - 1;
    hp = 0.93 * (hp + roh - vorher);
    vorher = roh;
    const wert = hp * huelle * staerke;
    links[stelle] += wert * nachLinks;
    rechts[stelle] += wert * (1 - nachLinks);
  }
}

// Bass: Saegezahn mit Tiefpass, der bei jeder Kick kurz zurueckgenommen wird.
// Dieses Ducken ist das, was Clubmusik nach Clubmusik klingen laesst.
function bassTon(links, rechts, start, rate, beatSekunden, freq, staerke, energie) {
  const laenge = Math.floor(beatSekunden * 0.95 * rate);
  let phase = 0;
  let tp = 0;
  const glaette = 0.12 + energie * 0.14;
  for (let i = 0; i < laenge; i++) {
    const stelle = start + i;
    if (stelle >= links.length) break;
    const t = i / rate;
    phase += freq / rate;
    if (phase > 1) phase -= 1;
    const saege = phase * 2 - 1;
    tp += glaette * (saege - tp);
    // Ducken: direkt nach der Kick leise, dann wieder hoch.
    const ducken = 1 - 0.75 * Math.exp(-t / 0.085);
    const huelle = Math.min(1, t / 0.005) * Math.exp(-t / (beatSekunden * 0.8));
    const wert = tp * ducken * huelle * staerke;
    links[stelle] += wert;
    rechts[stelle] += wert;
  }
}

// Stab: kurzer, harter Akkord auf dem Offbeat.
function stab(links, rechts, start, rate, freq, staerke) {
  const laenge = Math.floor(0.28 * rate);
  const stimmen = [1, 1.005, 1.498];
  const phasen = [0, 0, 0];
  let tp = 0;
  for (let i = 0; i < laenge; i++) {
    const stelle = start + i;
    if (stelle >= links.length) break;
    const t = i / rate;
    let summe = 0;
    for (let s = 0; s < stimmen.length; s++) {
      phasen[s] += (freq * stimmen[s]) / rate;
      if (phasen[s] > 1) phasen[s] -= 1;
      summe += phasen[s] * 2 - 1;
    }
    tp += 0.35 * (summe / stimmen.length - tp);
    const huelle = Math.min(1, t / 0.004) * Math.exp(-t / 0.09);
    const wert = tp * huelle * staerke;
    links[stelle] += wert;
    rechts[stelle] += wert * 0.85;
  }
}

// Flaeche: langsam anschwellender, dunkler Akkord fuer Intro und Breakdown.
function flaeche(links, rechts, start, rate, dauer, freq, staerke) {
  const laenge = Math.floor(dauer * rate);
  const stimmen = [0.5, 0.7515, 1, 1.003];
  const phasen = new Array(stimmen.length).fill(0);
  let tpL = 0;
  let tpR = 0;
  for (let i = 0; i < laenge; i++) {
    const stelle = start + i;
    if (stelle >= links.length) break;
    const t = i / rate;
    let summe = 0;
    for (let s = 0; s < stimmen.length; s++) {
      phasen[s] += (freq * stimmen[s]) / rate;
      if (phasen[s] > 1) phasen[s] -= 1;
      summe += phasen[s] * 2 - 1;
    }
    summe /= stimmen.length;
    // Zwei leicht verschiedene Tiefpaesse ergeben Breite.
    tpL += 0.06 * (summe - tpL);
    tpR += 0.055 * (summe - tpR);
    const huelle = Math.min(1, t / (dauer * 0.35)) * Math.min(1, (dauer - t) / (dauer * 0.4));
    links[stelle] += tpL * huelle * staerke;
    rechts[stelle] += tpR * huelle * staerke;
  }
}

// Weiche Begrenzung statt hartem Anschlag.
function weich(wert) {
  return Math.tanh(wert * 0.8);
}


// ===== public/gemeinsam/konfiguration.js =====
// Alles, was du vor der Party einstellst, steht hier. Eine Datei, damit du am
// Abend nicht im Code suchen musst.

const konfiguration = {
  // Wie der Abend heisst - steht gross auf dem Monitor.
  anlass: '30. Geburtstag',

  // Port des Servers. Gaeste erreichen die Abstimmung unter
  // http://<IP-des-Laptops>:<port>/p
  port: 3000,

  // Ordner mit deinen Musikdateien (relativ zum Projekt oder absolut).
  musikOrdner: './musik',

  // ------------------------------------------------------------------
  // Die Energiekurve: das Herzstueck. Erst chillig, spaeter haerter.
  // ------------------------------------------------------------------
  // Uhrzeit -> Zielenergie zwischen 0 (Ambient) und 1 (Brett).
  // Dazwischen wird linear interpoliert. Zeiten nach Mitternacht einfach
  // weiterzaehlen (25:00 = 1 Uhr nachts), dann gibt es keine Sprungstelle.
  energiekurve: [
    { zeit: '19:00', energie: 0.15 }, // Ankommen, Reden muss moeglich sein
    { zeit: '21:00', energie: 0.35 }, // Es fuellt sich
    { zeit: '22:30', energie: 0.55 }, // Erste tanzen
    { zeit: '24:00', energie: 0.75 }, // Der Laden laeuft
    { zeit: '25:30', energie: 0.9 }, // Haerter
    { zeit: '27:00', energie: 0.8 }, // Auslaufen
    { zeit: '28:00', energie: 0.5 },
  ],

  // Wie stark die Gaeste die Kurve verbiegen duerfen. 0.15 heisst: die
  // Abstimmung kann die Zielenergie um hoechstens +/- 0.15 verschieben.
  // Damit bleibt der Abend in deiner Hand, aber die Gaeste merken ihren Einfluss.
  stimmenEinfluss: 0.15,

  // ------------------------------------------------------------------
  // Mischen
  // ------------------------------------------------------------------
  mix: {
    // Laenge eines Uebergangs in Beats. 32 Beats sind bei 128 BPM 15 Sekunden.
    uebergangBeats: 32,
    // Wie weit das Tempo eines Tracks gezogen werden darf, bevor es unnatuerlich
    // klingt. 0.06 = +/- 6 Prozent. Darueber wird nicht mehr angeglichen.
    tempoToleranz: 0.06,
    // Zielkorridor beim Aussuchen: naechster Track darf so weit vom aktuellen
    // Tempo abweichen, sonst faellt er raus.
    bpmFenster: 0.1,
    // Wie viele Tracks ein gespielter Titel gesperrt bleibt.
    sperreNachTracks: 25,
  },

  // ------------------------------------------------------------------
  // Klangqualitaet
  // ------------------------------------------------------------------
  // Jeder Track bekommt beim Einlesen eine gemessene Note (siehe
  // einlesen/qualitaet.mjs). Statt schwaechere Aufnahmen auszusortieren,
  // setzen wir sie dort ein, wo sie nicht auffallen: Um 21 Uhr bei halber
  // Lautstaerke hoert man einen 16-kHz-Abbruch, um zwei Uhr im vollen Raum
  // niemand mehr. So bleibt ein YouTube-Wunsch spielbar, ohne dass er den
  // aufmerksamen Teil des Abends kostet.
  klang: {
    // Ab dieser Note gilt ein Track als einwandfrei und laeuft immer.
    guteNote: 0.85,
    // Wie viel Zielenergie ein gerade noch zugelassener Track braucht.
    maxAnforderung: 0.75,
    // Wie stark die Note bei sonst gleicher Passung den Ausschlag gibt.
    gewicht: 0.1,
    // Tracks ohne Messung (aelteres Material) werden so bewertet.
    annahmeOhneMessung: 0.8,
  },

  // ------------------------------------------------------------------
  // Abstimmung
  // ------------------------------------------------------------------
  abstimmung: {
    // Hoechstens jeder n-te Track ist ein Gaestewunsch. Der Rest kommt vom
    // Autopilot. Sonst zerlegt der erste Gast mit Handy den ganzen Abend.
    wunschJederNteTrack: 3,
    // Wie lange eine Richtungsstimme (chilliger/haerter) zaehlt, in Minuten.
    stimmeGiltMinuten: 20,
    // Wie viele offene Wuensche ein Geraet gleichzeitig haben darf.
    wuenscheProGeraet: 2,
  },
};

// Interpoliert die Zielenergie fuer einen Zeitpunkt aus der Kurve.
// `minuten` sind Minuten seit Mitternacht, Werte ueber 24h erlaubt.
function zielenergie(minuten, kurve = konfiguration.energiekurve) {
  const punkte = kurve.map((p) => ({
    minuten: inMinuten(p.zeit),
    energie: p.energie,
  }));

  if (minuten <= punkte[0].minuten) return punkte[0].energie;
  const letzter = punkte[punkte.length - 1];
  if (minuten >= letzter.minuten) return letzter.energie;

  for (let i = 0; i < punkte.length - 1; i++) {
    const a = punkte[i];
    const b = punkte[i + 1];
    if (minuten >= a.minuten && minuten <= b.minuten) {
      const anteil = (minuten - a.minuten) / (b.minuten - a.minuten);
      return a.energie + anteil * (b.energie - a.energie);
    }
  }
  return letzter.energie;
}

// '25:30' -> 1530. Stunden ueber 24 sind erlaubt und meinen den Folgetag.
function inMinuten(zeit) {
  const [h, m] = zeit.split(':').map(Number);
  return h * 60 + m;
}

// Jetzt als Minuten seit Mitternacht - nach 24 Uhr wird weitergezaehlt, solange
// es vor 10 Uhr morgens ist. Damit passt die Kurve ueber den Tageswechsel.
function jetztInMinuten(datum = new Date()) {
  const minuten = datum.getHours() * 60 + datum.getMinutes();
  return datum.getHours() < 10 ? minuten + 24 * 60 : minuten;
}


// ===== public/gemeinsam/zustand.js =====
// Der Zustand des Abends. Bewusst nur im Arbeitsspeicher: Wenn der Server neu
// startet, faengt der Abend halt neu an - das ist in vier Stunden Party
// verschmerzbar und spart eine Datenbank, die auf einer Laptop-Party nur
// kaputtgehen kann.


const zustand = {
  // Was gerade laeuft, gemeldet von der Buehne.
  laeuft: null, // { id, titel, interpret, bpm, energie, dauer, begonnen }
  alsNaechstes: null,

  // Reihenfolge der bereits gespielten Track-IDs, neuester zuletzt.
  gespielt: [],

  // trackId -> { stimmen: Set<geraetId>, erstellt: ms }
  wuensche: new Map(),

  // Richtungsstimmen: { geraetId, richtung: 'chilliger'|'haerter', zeit: ms }
  richtungen: [],

  // Zaehler, damit nicht jeder Track ein Gaestewunsch ist.
  seitLetztemWunsch: 99,

  // Handbetrieb: setzt der Gastgeber das, ignoriert der Autopilot die Kurve.
  handEnergie: null,
};

// --- Richtungsstimmen -----------------------------------------------------

// Nur Stimmen aus dem Zeitfenster zaehlen. Aeltere fallen still raus, damit
// die Stimmung von vor zwei Stunden nicht den Rest des Abends bestimmt.
function frischeRichtungen(jetzt = Date.now()) {
  const fenster = konfiguration.abstimmung.stimmeGiltMinuten * 60_000;
  zustand.richtungen = zustand.richtungen.filter((r) => jetzt - r.zeit < fenster);
  return zustand.richtungen;
}

// Verschiebung der Zielenergie durch die Gaeste, begrenzt auf stimmenEinfluss.
function stimmenVerschiebung(jetzt = Date.now()) {
  const stimmen = frischeRichtungen(jetzt);
  if (stimmen.length === 0) return 0;

  // Pro Geraet zaehlt nur die letzte Stimme - sonst gewinnt, wer am meisten tippt.
  const jeGeraet = new Map();
  for (const s of stimmen) jeGeraet.set(s.geraetId, s.richtung);

  let summe = 0;
  for (const richtung of jeGeraet.values()) {
    summe += richtung === 'haerter' ? 1 : -1;
  }

  // Der Ausschlag waechst mit der Einigkeit, nicht mit der reinen Anzahl:
  // 8 von 10 fuer haerter wiegt schwerer als 8 von 30.
  const anteil = summe / jeGeraet.size;
  return anteil * konfiguration.stimmenEinfluss;
}

// Die Zielenergie, an der sich die Auswahl orientiert.
function aktuelleZielenergie(jetzt = Date.now()) {
  if (zustand.handEnergie !== null) return zustand.handEnergie;
  const basis = zielenergie(jetztInMinuten(new Date(jetzt)));
  const roh = basis + stimmenVerschiebung(jetzt);
  return Math.min(1, Math.max(0, roh));
}

// --- Wuensche -------------------------------------------------------------

function wunschEintragen(trackId, geraetId) {
  let wunsch = zustand.wuensche.get(trackId);
  if (!wunsch) {
    wunsch = { stimmen: new Set(), erstellt: Date.now() };
    zustand.wuensche.set(trackId, wunsch);
  }
  wunsch.stimmen.add(geraetId);
  return wunsch;
}

function wunschZuruecknehmen(trackId, geraetId) {
  const wunsch = zustand.wuensche.get(trackId);
  if (!wunsch) return;
  wunsch.stimmen.delete(geraetId);
  if (wunsch.stimmen.size === 0) zustand.wuensche.delete(trackId);
}

// Wie viele offene Wuensche ein Geraet gerade traegt.
function wuenscheVon(geraetId) {
  let anzahl = 0;
  for (const wunsch of zustand.wuensche.values()) {
    if (wunsch.stimmen.has(geraetId)) anzahl++;
  }
  return anzahl;
}

// Wuensche nach Stimmen sortiert, bereits Gespieltes faellt raus.
function wunschliste() {
  const gespielt = new Set(zustand.gespielt);
  return [...zustand.wuensche.entries()]
    .filter(([id]) => !gespielt.has(id))
    .map(([id, w]) => ({ id, stimmen: w.stimmen.size, erstellt: w.erstellt }))
    .sort((a, b) => b.stimmen - a.stimmen || a.erstellt - b.erstellt);
}

function alsGespieltVermerken(trackId) {
  zustand.gespielt.push(trackId);
  zustand.wuensche.delete(trackId);
}


// ===== public/gemeinsam/auswahl.js =====
// Wer kommt als naechstes? Diese Datei ist der eigentliche DJ-Kopf.
//
// Grundsatz: Es wird *immer* ein Track zurueckgegeben. Stille ist auf einer
// Party der einzige echte Fehler, den dieses System machen kann. Lieber ein
// mittelmaessiger Uebergang als drei Sekunden nichts.


// Gewichte der Bewertung. Energie dominiert, weil sie den Bogen des Abends
// traegt; das Tempo ist eher Handwerk und wird beim Mischen ohnehin angeglichen.
const GEWICHT = {
  energie: 0.5,
  tempo: 0.25,
  frische: 0.15,
  stimmen: 0.1,
};

// Ab welcher Zielenergie ein Track mit dieser Note ueberhaupt in Frage kommt.
// Der laute Raum spaeter am Abend deckt zu, was um neun aufgefallen waere.
function benoetigteEnergie(note) {
  const { guteNote, maxAnforderung, annahmeOhneMessung } = konfiguration.klang;
  const wert = typeof note === 'number' ? note : annahmeOhneMessung;
  if (wert >= guteNote) return 0;
  const spanne = guteNote - 0.35; // 0.35 ist die Untergrenze beim Einlesen
  const wieSchlecht = Math.min(1, (guteNote - wert) / spanne);
  return wieSchlecht * maxAnforderung;
}

function naechsterTrack(bibliothek, aktuellerBpm = null) {
  if (!bibliothek || bibliothek.length === 0) return null;

  const ziel = aktuelleZielenergie();
  const gesperrt = neulichGespielt();

  // 1. Darf ein Gaestewunsch dran? -----------------------------------------
  const wunsch = faelligerWunsch(bibliothek, aktuellerBpm, gesperrt, ziel);
  if (wunsch) {
    zustand.seitLetztemWunsch = 0;
    return { track: wunsch, grund: 'wunsch', ziel };
  }

  // 2. Sonst entscheidet die Bewertung --------------------------------------
  // Ist nach Sperre und Qualitaetsschranke nichts mehr uebrig, muss eine der
  // beiden fallen. Welche, haengt vom Raum ab: Im leisen Raum hoert man eine
  // dumpfe Aufnahme sofort, eine Wiederholung nach anderthalb Stunden kaum.
  // Spaeter ist es umgekehrt - da faellt Wiederholung auf und Dumpfheit geht
  // im Pegel unter.
  const frei = bibliothek.filter((t) => !gesperrt.has(t.id));
  const hoerbar = frei.filter((t) => benoetigteEnergie(t.note) <= ziel + 1e-6);

  let menge = hoerbar;
  if (menge.length === 0) {
    const leiserRaum = ziel < 0.5;
    const trotzSperre = bibliothek.filter((t) => benoetigteEnergie(t.note) <= ziel + 1e-6);
    menge = leiserRaum
      ? // Qualitaet halten, Wiederholung in Kauf nehmen.
        (trotzSperre.length > 0 ? trotzSperre : frei)
      : // Frische halten, dumpferes Material zulassen.
        (frei.length > 0 ? frei : trotzSperre);
  }
  if (menge.length === 0) menge = bibliothek;

  const stimmen = stimmenNachTrack();
  let bester = null;
  let besteBewertung = -Infinity;

  for (const track of menge) {
    const bewertung =
      GEWICHT.energie * energiePassung(track.energie, ziel) +
      GEWICHT.tempo * tempoPassung(track.bpm, aktuellerBpm) +
      GEWICHT.frische * frische(track.id) +
      GEWICHT.stimmen * (stimmen.get(track.id) ?? 0) +
      // Bei sonst gleicher Passung gewinnt die bessere Aufnahme.
      konfiguration.klang.gewicht * (track.note ?? konfiguration.klang.annahmeOhneMessung) +
      // Ein Hauch Zufall, damit zwei aehnliche Abende nicht identisch klingen
      // und der Autopilot nicht immer denselben Lieblingstrack zieht.
      Math.random() * 0.05;

    if (bewertung > besteBewertung) {
      besteBewertung = bewertung;
      bester = track;
    }
  }

  zustand.seitLetztemWunsch++;
  return { track: bester, grund: 'autopilot', ziel };
}

// --- Teilbewertungen ------------------------------------------------------

// 1 bei perfekter Passung, 0 bei maximalem Abstand.
function energiePassung(energie, ziel) {
  if (typeof energie !== 'number') return 0.5;
  return 1 - Math.abs(energie - ziel);
}

// Innerhalb des Fensters voll, ausserhalb faellt es steil ab. Ohne laufenden
// Track ist jedes Tempo recht.
function tempoPassung(bpm, aktuellerBpm) {
  if (!aktuellerBpm || !bpm) return 1;
  const abweichung = Math.abs(bpm - aktuellerBpm) / aktuellerBpm;
  const fenster = konfiguration.mix.bpmFenster;
  if (abweichung <= fenster) return 1 - abweichung / fenster / 4;

  // Halbes oder doppeltes Tempo passt musikalisch oft trotzdem (128 zu 64).
  const halb = Math.abs(bpm * 2 - aktuellerBpm) / aktuellerBpm;
  const doppelt = Math.abs(bpm / 2 - aktuellerBpm) / aktuellerBpm;
  if (Math.min(halb, doppelt) <= fenster) return 0.6;

  return Math.max(0, 1 - abweichung * 3);
}

// 1, wenn der Track heute noch nicht lief.
function frische(id) {
  const stelle = zustand.gespielt.lastIndexOf(id);
  if (stelle === -1) return 1;
  const her = zustand.gespielt.length - stelle;
  return Math.min(1, her / (konfiguration.mix.sperreNachTracks * 2));
}

function neulichGespielt() {
  return new Set(zustand.gespielt.slice(-konfiguration.mix.sperreNachTracks));
}

// Stimmen auf 0..1 normiert, damit ein Track mit 8 Stimmen nicht alles kippt.
function stimmenNachTrack() {
  const liste = wunschliste();
  const karte = new Map();
  if (liste.length === 0) return karte;
  const hoechste = liste[0].stimmen || 1;
  for (const eintrag of liste) {
    karte.set(eintrag.id, eintrag.stimmen / hoechste);
  }
  return karte;
}

// --- Gaestewuensche -------------------------------------------------------

// Der meistgewaehlte Wunsch, aber nur wenn er dran ist und tempomaessig nicht
// voellig aus dem Rahmen faellt. Ein Wunsch, der den Abend zerlegt, wartet auf
// den naechsten passenden Moment statt abgelehnt zu werden.
function faelligerWunsch(bibliothek, aktuellerBpm, gesperrt, ziel) {
  if (zustand.seitLetztemWunsch < konfiguration.abstimmung.wunschJederNteTrack) {
    return null;
  }

  const nachId = new Map(bibliothek.map((t) => [t.id, t]));
  for (const eintrag of wunschliste()) {
    const track = nachId.get(eintrag.id);
    if (!track || gesperrt.has(track.id)) continue;
    if (tempoPassung(track.bpm, aktuellerBpm) < 0.5) continue;
    // Ein dumpfer YouTube-Wunsch wird nicht abgelehnt, sondern wartet auf den
    // lauten Teil des Abends. Der Gast bekommt ihn - nur eben spaeter.
    if (benoetigteEnergie(track.note) > ziel + 1e-6) continue;
    return track;
  }
  return null;
}


// ===== public/gemeinsam/leitung.js =====
// Woher kommt der Zustand - vom Server oder aus dem Browser selbst?
//
// Zwei Betriebsarten, eine Schnittstelle:
//
//   Alleinbetrieb  Alles laeuft im Browser. Kein Server, keine Installation.
//                  Damit funktioniert die Buehne als reine statische Seite -
//                  auf Vercel, auf einem iPad, im Flugzeug. Keine Gaeste,
//                  keine Wuensche, aber die ganze Mischmaschine.
//
//   Serverbetrieb  Wie am Partyabend: der Server haelt Bibliothek, Wuensche
//                  und Abstimmung, mehrere Geraete sehen denselben Stand.
//
// Wichtig ist, dass beide *dieselbe* Auswahllogik benutzen. Deshalb liegen
// auswahl.js und zustand.js hier in gemeinsam/ und nicht im Server: Was du im
// Alleinbetrieb hoerst, entscheidet am Partyabend derselbe Code.


// --- Serverbetrieb --------------------------------------------------------

class ServerLeitung {
  constructor() {
    this.art = 'server';
    this.beschreibung = 'mit Server';
  }

  async bibliothek() {
    const { tracks } = await (await fetch('/api/bibliothek')).json();
    return tracks ?? [];
  }

  async bibliothekSetzen(tracks) {
    await fetch('/api/bibliothek', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tracks }),
    });
  }

  async naechster(bpm) {
    const antwort = await fetch(`/api/naechster?bpm=${bpm ?? ''}`);
    if (!antwort.ok) throw new Error('Der Server hat keinen naechsten Track');
    return antwort.json();
  }

  async laeuftMelden(track, alsNaechstes) {
    await fetch('/api/laeuft', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ track, alsNaechstes }),
    }).catch(() => {});
  }

  async handEnergie(energie) {
    await fetch('/api/hand', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ energie }),
    });
  }

  beiZustand(rueckruf) {
    const strom = new EventSource('/api/strom');
    strom.onmessage = (nachricht) => rueckruf(JSON.parse(nachricht.data));
    return () => strom.close();
  }
}

// --- Alleinbetrieb --------------------------------------------------------

class EigenLeitung {
  constructor() {
    this.art = 'allein';
    this.beschreibung = 'ohne Server';
    this.tracks = [];
    this.zuhoerer = [];
    // Die Zielenergie wandert mit der Uhr, auch wenn niemand etwas tut.
    this.takt = setInterval(() => this.melden(), 5000);
  }

  async bibliothek() {
    return this.tracks;
  }

  async bibliothekSetzen(tracks) {
    this.tracks = tracks;
    this.melden();
  }

  async naechster(bpm) {
    const wahl = naechsterTrack(this.tracks, bpm);
    if (!wahl) throw new Error('Bibliothek ist leer');
    zustand.alsNaechstes = wahl.track;
    this.melden();
    return wahl;
  }

  async laeuftMelden(track, alsNaechstes) {
    zustand.laeuft = { ...track, begonnen: Date.now() };
    if (track?.id) alsGespieltVermerken(track.id);
    zustand.alsNaechstes = alsNaechstes ?? null;
    this.melden();
  }

  async handEnergie(energie) {
    zustand.handEnergie = energie === null ? null : Math.min(1, Math.max(0, energie));
