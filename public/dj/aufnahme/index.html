<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" />
    <title>Musik vermessen</title>
    <style>
      :root {
        color-scheme: dark;
        --grund: #0a0a0f;
        --karte: #16161f;
        --rand: #2a2a3a;
        --text: #eeeef5;
        --leise: #8a8aa0;
        --akzent: #ff3d7f;
        --kuehl: #3d9bff;
        --gut: #3ddc97;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0 auto;
        padding: 1.5rem 1rem 4rem;
        background: var(--grund);
        color: var(--text);
        font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
        max-width: 46rem;
      }
      h1 {
        font-size: 1.1rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--leise);
        margin: 0 0 0.4rem;
      }
      p.hinweis {
        color: var(--leise);
        margin: 0 0 1.5rem;
        font-size: 0.92rem;
      }
      .leiste {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 1.2rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: var(--grund);
        background: var(--akzent);
        border: 0;
        border-radius: 0.7rem;
        padding: 0.6rem 1.1rem;
        cursor: pointer;
      }
      button.still {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--rand);
      }
      button[disabled] {
        opacity: 0.45;
        cursor: default;
      }
      .stand {
        color: var(--leise);
        font-size: 0.9rem;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.5rem;
      }
      li {
        background: var(--karte);
        border: 1px solid var(--rand);
        border-radius: 0.8rem;
        padding: 0.7rem 0.9rem;
      }
      .name {
        font-weight: 600;
        word-break: break-word;
      }
      .zeile {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: baseline;
      }
      .zustand {
        font-size: 0.85rem;
        color: var(--leise);
        white-space: nowrap;
      }
      .zustand.fertig {
        color: var(--gut);
      }
      .zustand.fehler {
        color: var(--akzent);
      }
      .werte {
        font-size: 0.85rem;
        color: var(--leise);
        margin-top: 0.3rem;
      }
      .balken {
        height: 3px;
        background: var(--rand);
        border-radius: 2px;
        margin-top: 0.5rem;
        overflow: hidden;
      }
      .balken i {
        display: block;
        height: 100%;
        background: var(--kuehl);
        width: 0;
        transition: width 0.2s;
      }
      .fehlerkasten {
        border: 1px solid var(--akzent);
        border-radius: 0.8rem;
        padding: 0.8rem 1rem;
        margin-bottom: 1.2rem;
        color: var(--akzent);
        font-size: 0.9rem;
      }
      a {
        color: var(--kuehl);
      }
    </style>
  </head>
  <body>
    <h1>Musik vermessen</h1>
    <p class="hinweis">
      Legt die Dateien aus <code>musik/</code> in die Bibliothek – Tempo, Raster, Lautheit,
      Aufbau. Bei Stundenmixen entsteht dabei eine Tempo-Karte mit einem Eintrag je Stück.
      Rechnet im Browser; das Fenster muss offen bleiben.
      <br />Danach: <a href="/buehne">zur Bühne</a>.
    </p>

    <div id="fehler" class="fehlerkasten" hidden></div>

    <div class="leiste">
      <button id="starten">Vermessen</button>
      <button id="neuLaden" class="still">Ordner neu lesen</button>
      <label class="stand">
        <input type="checkbox" id="alle" /> auch schon vermessene noch einmal
      </label>
      <span id="stand" class="stand"></span>
    </div>

    <ul id="liste"></ul>

    <!--
      Absoluter Pfad, nicht ./aufnahme.js: Die Seite ist auch unter der
      Kurzadresse /aufnahme erreichbar, und dort - ohne Schraegstrich am Ende -
      loest ./ auf die Wurzel auf. Das Ergebnis war ein 404 und eine Seite, die
      stumm leer blieb.
    -->
    <script type="module" src="/aufnahme/aufnahme.js"></script>
  </body>
</html>
